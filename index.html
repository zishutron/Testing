          <div class="quick-link-icon">${link.icon ? escapeHtml(link.icon) : (link.title ? link.title.charAt(0).toUpperCase() : '?')}</div>

          <button class="quick-link-remove" data-idx="${idx}" aria-label="Remove">✕</button>
        `;

          if (e.target.classList.contains('quick-link-remove')) {
            e.stopPropagation();
            BrowserState.state.quickLinks.splice(idx, 1);
            StorageManager.set('quickLinks', BrowserState.state.quickLinks);

          }
          NavigationManager.navigate(link.url);
        });
        grid.appendChild(el);
      });

      // Search input
      const searchInput = page.querySelector('#newTabInput');
      if (searchInput) {
        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {

        });

      page.querySelectorAll('.recent-list .list-row').forEach(row => {

      const placeholder = document.getElementById('webviewPlaceholder');
      if (placeholder) placeholder.style.display = 'none';

    // --- History Page ---

      const existing = document.getElementById('pageContent');

      page.id = 'pageContent';

      let html = `
        <div style="padding:16px">

            <button class="btn btn-secondary" id="clearHistoryBtn" style="font-size:12px;padding:6px 12px">Clear All</button>
          </div>
          <input type="text" id="historySearch" placeholder="Search history..." style="width:100%;height:40px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:0 12px;font-size:14px;color:var(--text-primary);outline:none;margin-bottom:16px;font-family:var(--font-system)">

            <div class="empty-state">
              <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>

    function renderBookmarksPage() {

      let html = `

      page.innerHTML = html;
      container.appendChild(page);

      const listEl = page.querySelector('#bookmarkList');
      const searchEl = page.querySelector('#bookmarkSearch');

      function renderList(filter) {
        const filtered = filter ? BookmarkManager.search(filter) : bookmarks;
        if (filtered.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
              <div class="empty-state-title">No bookmarks yet</div>
              <div class="empty-state-desc">Tap the bookmark button to save pages.</div>
            </div>

          return;
        }

        listEl.innerHTML = '';
        filtered.forEach((b) => {
          const row = document.createElement('div');
          row.className = 'list-row';
          row.innerHTML = `
            <div class="list-row-icon">
              ${b.favicon ? `<img src="${escapeHtml(b.favicon)}" alt="">` : `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`}

            <div class="list-row-content">
              <div class="list-row-title">${escapeHtml(b.title || b.url)}</div>
              <div class="list-row-subtitle">${escapeHtml(SearchManager.getDisplayUrl(b.url))}</div>

            <button class="list-row-action" data-id="${b.id}" aria-label="Remove bookmark">
              <svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>

          row.querySelector('.list-row-content').addEventListener('click', () => NavigationManager.navigate(b.url));
          row.querySelector('.list-row-action').addEventListener('click', (e) => {
            e.stopPropagation();
            BookmarkManager.remove(b.id);
            renderList(searchEl.value);
          });

      renderList('');

      searchEl.addEventListener('input', () => {
        renderList(searchEl.value);

          const title = prompt('Enter title (optional):') || url;
          BookmarkManager.add({ url, title });
          renderList(searchEl.value);
          UIManager.showToast('Bookmark added');

      });

      if (placeholder) placeholder.style.display = 'none';

    // --- Downloads Page ---
    function renderDownloadsPage() {
      const container = document.getElementById('webviewContainer');
      if (!container) return;
      const existing = document.getElementById('pageContent');
      if (existing) existing.remove();

      const page = document.createElement('div');
      page.className = 'page-content';
      page.id = 'pageContent';

      const downloads = BrowserState.state.downloads;
      let html = `
        <div style="padding:16px">
          <div style="font-size:20px;font-weight:700;margin-bottom:16px">Downloads</div>
          <div id="downloadList"></div>
        </div>
      `;
      page.innerHTML = html;
      container.appendChild(page);

      const listEl = page.querySelector('#downloadList');

      function renderList() {
        if (downloads.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              <div class="empty-state-title">No downloads</div>
              <div class="empty-state-desc">Files you download will appear here. Native download support required.</div>
            </div>
          `;
          return;
        }

        listEl.innerHTML = '';
        downloads.forEach((dl) => {
          const row = document.createElement('div');
          row.className = 'list-row';
          row.style.flexWrap = 'wrap';
          const statusText = {
            waiting: 'Waiting',
            downloading: DownloadManager.formatSpeed(dl.speed),
            paused: 'Paused',
            completed: 'Completed',
            failed: 'Failed',
            cancelled: 'Cancelled'
          }[dl.status] || dl.status;

          row.innerHTML = `
            <div class="list-row-icon">
              <svg viewBox="0 0 24 24"><path d="M6 2c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/></svg>
            </div>
            <div class="list-row-content">
              <div class="list-row-title">${escapeHtml(dl.filename)}</div>
              <div class="list-row-subtitle">${DownloadManager.formatSize(dl.size)} · ${statusText}</div>
              ${dl.status === 'downloading' || dl.status === 'paused' ? `
                <div style="height:4px;background:var(--bg-tertiary);border-radius:2px;margin-top:6px;overflow:hidden">
                  <div style="height:100%;width:${dl.progress || 0}%;background:var(--accent);border-radius:2px;transition:width 200ms"></div>
                </div>
              ` : ''}
            </div>
            <div style="display:flex;gap:4px;flex-shrink:0">
              ${dl.status === 'downloading' ? `
                <button class="list-row-action" data-action="pause" data-id="${dl.id}" aria-label="Pause">⏸</button>
                <button class="list-row-action" data-action="cancel" data-id="${dl.id}" aria-label="Cancel">✕</button>
              ` : ''}
              ${dl.status === 'paused' ? `
                <button class="list-row-action" data-action="resume" data-id="${dl.id}" aria-label="Resume">▶</button>
                <button class="list-row-action" data-action="cancel" data-id="${dl.id}" aria-label="Cancel">✕</button>
              ` : ''}
              ${dl.status === 'failed' ? `
                <button class="list-row-action" data-action="retry" data-id="${dl.id}" aria-label="Retry">↻</button>
                <button class="list-row-action" data-action="remove" data-id="${dl.id}" aria-label="Remove">✕</button>
              ` : ''}
              ${dl.status === 'completed' ? `
                <button class="list-row-action" data-action="open" data-id="${dl.id}" aria-label="Open">↗</button>
                <button class="list-row-action" data-action="remove" data-id="${dl.id}" aria-label="Remove">✕</button>
              ` : ''}
              ${dl.status === 'cancelled' ? `
                <button class="list-row-action" data-action="remove" data-id="${dl.id}" aria-label="Remove">✕</button>
              ` : ''}
            </div>
          `;
          listEl.appendChild(row);
        });

        // Event delegation for actions
        listEl.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const action = btn.getAttribute('data-action');
            const id = btn.getAttribute('data-id');
            if (action === 'pause') DownloadManager.pause(id);
            else if (action === 'resume') DownloadManager.resume(id);
            else if (action === 'cancel') DownloadManager.cancel(id);
            else if (action === 'retry') DownloadManager.retry(id);
            else if (action === 'remove') DownloadManager.remove(id);
            else if (action === 'open') {
              UIManager.showToast('Open requires native file access');
            }
            renderList();
          });
        });
      }

      renderList();

      const placeholder = document.getElementById('webviewPlaceholder');
      if (placeholder) placeholder.style.display = 'none';
    }

    // =================================================================
    // 22. SHARE CURRENT PAGE
    // =================================================================
    function shareCurrentPage() {
      const tab = BrowserState.getActiveTab();
      if (!tab || !tab.url) {
        UIManager.showToast('Nothing to share');
        return;
      }

      const shareData = {
        title: tab.title || '',
        url: tab.url,
        text: ''
      };

      // Try native bridge first
      if (NativeBridge.isAvailable()) {
        NativeBridge.share(shareData);
        return;
      }

      // Try Web Share API
      if (navigator.share) {
        navigator.share(shareData).catch(() => {
          fallbackShare(shareData);
        });
        return;
      }

      fallbackShare(shareData);
    }

    function fallbackShare(data) {
      UIManager.showDialog('Share', data.url, [
        { label: 'Copy URL', primary: true, onClick: () => {
          copyToClipboard(data.url);
        }},
        { label: 'Close', onClick: () => {} }
      ]);
    }

    // =================================================================
    // 23. CLIPBOARD
    // =================================================================
    function copyToClipboard(text) {
      if (NativeBridge.isAvailable()) {
        NativeBridge.copyText(text);
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          UIManager.showToast('Copied to clipboard');
        }).catch(() => {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        UIManager.showToast('Copied to clipboard');
      } catch (_) {
        UIManager.showToast('Copy not available');
      }
      document.body.removeChild(ta);
    }

    // =================================================================
    // 25. ADDRESS BAR SUGGESTIONS
    // =================================================================
    const SuggestionManager = (() => {
      let debounceTimer = null;

      function getSuggestions(query) {
        if (!query || !query.trim()) return [];
        const q = query.trim().toLowerCase();
        const suggestions = [];

        // History matches
        const historyMatches = BrowserState.state.history
          .filter(h => h.url.toLowerCase().includes(q) || (h.title && h.title.toLowerCase().includes(q)))
          .slice(0, 4)
          .map(h => ({ type: 'history', url: h.url, title: h.title || h.url, favicon: h.favicon }));

        // Bookmark matches
        const bookmarkMatches = BrowserState.state.bookmarks
          .filter(b => b.url.toLowerCase().includes(q) || (b.title && b.title.toLowerCase().includes(q)))
          .slice(0, 3)
          .map(b => ({ type: 'bookmark', url: b.url, title: b.title || b.url, favicon: b.favicon }));

        // Direct URL suggestion
        if (SearchManager.isUrl(query)) {
          suggestions.push({
            type: 'url',
            url: SearchManager.normalizeUrl(query),
            title: query,
            favicon: ''
          });
        }

        // Search suggestion
        if (!SearchManager.isUrl(query)) {
          suggestions.push({
            type: 'search',
            url: SearchManager.getSearchUrl(query),
            title: query,
            favicon: ''
          });
        }

        // Combine and deduplicate by URL
        const seen = new Set();
        const combined = [...historyMatches, ...bookmarkMatches, ...suggestions].filter(s => {
          if (seen.has(s.url)) return false;
          seen.add(s.url);
          return true;
        });

        return combined.slice(0, ZISHU_BROWSER_CONFIG.maxSuggestions);
      }

      function showSuggestions(query) {
        const container = document.getElementById('suggestions');
        if (!container) return;
        const suggestions = getSuggestions(query);
        if (suggestions.length === 0) {
          container.classList.remove('visible');
          BrowserState.state.ui.suggestionsOpen = false;
          return;
        }

        container.innerHTML = '';
        suggestions.forEach(s => {
          const item = document.createElement('div');
          item.className = 'suggestion-item';

          const iconSvg = s.type === 'search'
            ? '<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>'
            : s.type === 'bookmark'
              ? '<svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>'
              : '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>';

          const text = document.createElement('div');
          text.className = 'suggestion-text';
          text.textContent = s.title || s.url;

          item.innerHTML = iconSvg;
          item.appendChild(text);

          item.addEventListener('click', () => {
            hideSuggestions();
            NavigationManager.navigate(s.url);
          });

          container.appendChild(item);
        });

        container.classList.add('visible');
        BrowserState.state.ui.suggestionsOpen = true;
      }

      function hideSuggestions() {
        const container = document.getElementById('suggestions');
        if (container) container.classList.remove('visible');
        BrowserState.state.ui.suggestionsOpen = false;
      }

      return { showSuggestions, hideSuggestions, getSuggestions };
    })();

    // Address bar
    const addressInput = document.getElementById('addressInput');

    if (addressInput) {

      addressInput.addEventListener('input', () => {
        if (addressBar) addressBar.classList.toggle('has-text', !!addressInput.value);
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          SuggestionManager.showSuggestions(addressInput.value);
        }, 150);
      });

      addressInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          SuggestionManager.hideSuggestions();
          addressInput.blur();
          const value = addressInput.value.trim();
          if (value) {
            NavigationManager.navigate(value);
          }
        } else if (e.key === 'Escape') {
          SuggestionManager.hideSuggestions();
          addressInput.blur();
        }
      });

      addressInput.addEventListener('blur', () => {
        setTimeout(() => SuggestionManager.hideSuggestions(), 200);
      });
    }

    if (addressClear) {

    window.addEventListener('online', () => {

    // =================================================================
    // 27. NATIVE BRIDGE EVENT HANDLERS
    // =================================================================
    // These are called by the native Android layer via JavaScript injection.
    // They are intentionally global so native code can call them.

    window.ZishuBridgeEvents = {
      onNativeReady(data) {
        NativeBridge.detect();
        EventBus.emit('nativeReady', data || {});
        if (ZISHU_BROWSER_CONFIG.debug) console.log('[Bridge] nativeReady', data);
      },

      onNavigationChanged(data) {
        const nav = BrowserState.state.navigation;
        if (data.canGoBack !== undefined) nav.canGoBack = data.canGoBack;
        if (data.canGoForward !== undefined) nav.canGoForward = data.canGoForward;
        if (data.url) {
          nav.currentUrl = data.url;
          const tab = BrowserState.getActiveTab();
          if (tab) BrowserState.updateTab(tab.id, { url: data.url });
          updateAddressBar(data.url);
        }
        if (data.title) {
          const tab = BrowserState.getActiveTab();
          if (tab) BrowserState.updateTab(tab.id, { title: data.title });
        }
        if (data.securityState) {
          nav.securityState = data.securityState;
          updateSecurityIndicator(data.securityState);
        }
        updateNavButtons();
        EventBus.emit('navigationChanged', data);
      },

      onPageStarted(data) {
        const nav = BrowserState.state.navigation;
        nav.isLoading = true;
        nav.currentUrl = data.url || nav.currentUrl;
        updateSecurityIndicator('loading');
        updateReloadButton(true);
        NavigationManager.startProgress();
        EventBus.emit('pageStarted', data);
      },

      onPageFinished(data) {
        const nav = BrowserState.state.navigation;
        nav.isLoading = false;
        NavigationManager.stopProgress();
        updateReloadButton(false);

        const tab = BrowserState.getActiveTab();
        if (tab) {
          BrowserState.updateTab(tab.id, {
            url: data.url || tab.url,
            title: data.title || tab.title,
            favicon: data.favicon || tab.favicon,
            loading: false
          });
          updateAddressBar(data.url || tab.url);
          updateSecurityIndicator(SearchManager.getSecurityState(data.url || tab.url));

          // Update history with title
          if (data.url && data.title && !tab.private) {
            HistoryManager.add({
              url: data.url,
              title: data.title,
              favicon: data.favicon,
              private: false
            });
          }
        }
        EventBus.emit('pageFinished', data);
      },

      onPageError(data) {
        const nav = BrowserState.state.navigation;
        nav.isLoading = false;
        NavigationManager.stopProgress();
        updateReloadButton(false);
        updateSecurityIndicator('error');
        EventBus.emit('pageError', data);
      },

      onDownloadStarted(data) {
        DownloadManager.add({
          url: data.url,
          filename: data.filename || 'download',
          mimeType: data.mimeType || '',
          size: data.size || 0
        });
        UIManager.showToast('Download started');
        EventBus.emit('downloadStarted', data);
      },

      onDownloadProgress(data) {
        DownloadManager.update(data.id, {
          downloaded: data.downloaded || 0,
          size: data.size || 0,
          speed: data.speed || 0,
          status: 'downloading'
        });
        EventBus.emit('downloadProgress', data);
      },

      onDownloadFinished(data) {
        DownloadManager.update(data.id, {
          status: 'completed',
          downloaded: data.size || 0,
          size: data.size || 0,
          endTime: Date.now()
        });
        UIManager.showToast('Download complete');
        EventBus.emit('downloadFinished', data);
      },

      onDownloadError(data) {
        DownloadManager.update(data.id, {
          status: 'failed',
          error: data.error || 'Unknown error',
          endTime: Date.now()
        });
        UIManager.showToast('Download failed');
        EventBus.emit('downloadError', data);
      },

      onPermissionResult(data) {
        EventBus.emit('permissionResult', data);
      },

      onFileSelected(data) {
        EventBus.emit('fileSelected', data);
      },

      onShareCompleted(data) {
        EventBus.emit('shareCompleted', data);
      },

      onThemeChanged(data) {
        if (data.theme) {
          SettingsManager.set('theme', data.theme);
          ThemeManager.apply(data.theme);
        }
        EventBus.emit('themeChanged', data);
      },

      onNetworkChanged(data) {
        EventBus.emit('networkChanged', data);
      },

      onFullscreenChanged(data) {
        EventBus.emit('fullscreenChanged', data);
      },

      onOrientationChanged(data) {
        EventBus.emit('orientationChanged', data);
      },

      onBackPressed() {
        // Handle back button
        if (BrowserState.state.ui.suggestionsOpen) {
          SuggestionManager.hideSuggestions();
          return true;
        }
        if (BrowserState.state.ui.findBarOpen) {
          closeFindBar();
          return true;
        }
        if (BrowserState.state.ui.tabOverviewOpen) {
          UIManager.closeTabOverview();
          return true;
        }
        if (BrowserState.state.ui.sheetOpen) {
          UIManager.closeSheet();
          return true;
        }
        const nav = BrowserState.state.navigation;
        if (nav.canGoBack) {
          NavigationManager.goBack();
          return true;
        }
        // Allow native to handle exit
        return false;
      }
    };

    // =================================================================
    // 28. INITIALIZATION
    // =================================================================
    function init() {
      // 1. Initialize storage
      StorageManager.init();

      // 2. Load persisted data
      SettingsManager.load();
      HistoryManager.load();
      BookmarkManager.load();
      DownloadManager.load();
      BrowserState.state.quickLinks = StorageManager.get('quickLinks', []);

      // 3. Detect capabilities
      CapabilityManager.detect();

      // 4. Detect native bridge
      NativeBridge.detect();

      // 5. Initialize theme
      ThemeManager.init();

      // 6. Create initial tab
      const initialUrl = SettingsManager.get('homepage') || ZISHU_BROWSER_CONFIG.homepage;
      const tab = BrowserState.createTab({
        url: initialUrl,
        title: 'New Tab'
      });
      BrowserState.setActiveTab(tab.id);

      // 7. Render UI
      UIManager.updateTabCountBadge();
      renderBrowserChrome();

      // 8. Show new tab page
      NavigationManager.handleInternalPage(initialUrl);

      // 9. Debug info
      if (ZISHU_BROWSER_CONFIG.debug) {
        console.log('[Zishu] Initialized', {
          version: ZISHU_BROWSER_CONFIG.version,
          nativeBridge: NativeBridge.isAvailable(),
          capabilities: CapabilityManager.getAll()
        });
      }
    }

    // Start the browser
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
  </script>
</body>
</html>
