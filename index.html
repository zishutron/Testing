<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#408071">
<title>Zishu App Creator</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Zishu%20App%20Creator%22%2C%22short_name%22%3A%22Zishu%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FCFDF9%22%2C%22theme_color%22%3A%22%23408071%22%7D">
<style>
/* ============ THEME ============ */
:root{
  --main-mint:#9AD2B7;--soft-mint:#D3ECD3;--light-green:#E4F2E4;
  --teal-green:#5D9987;--deep-teal:#408071;
  --bg:#FCFDF9;--surface:#FFFFFF;--surface-2:#F4FAF5;
  --text-dark:#1F2D27;--text-mid:#4D635A;--text-muted:#7A8F85;
  --border:#D9E6DC;--danger:#C24A4A;--warning:#C9884A;
  --shadow-sm:0 1px 2px rgba(31,45,39,.06);
  --shadow-md:0 4px 16px rgba(31,45,39,.08);
  --shadow-lg:0 12px 32px rgba(31,45,39,.14);
  --radius-sm:8px;--radius-md:12px;--radius-lg:18px;--radius-xl:24px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --font-mono:"JetBrains Mono","Fira Code",Consolas,"Courier New",monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --line-h:21px;--code-fs:13px;
}
[data-theme="dark"]{
  --bg:#0F1714;--surface:#151F1B;--surface-2:#1B2620;
  --text-dark:#E6EFE9;--text-mid:#B7C6BD;--text-muted:#7F9187;
  --border:#26332C;--light-green:#1B2620;--soft-mint:#1F2C25;
  --danger:#E07A7A;--warning:#E0A55F;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;}
body{background:var(--bg);color:var(--text-dark);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;}
button{font-family:inherit;font-size:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0;}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--text-dark);user-select:text;-webkit-user-select:text;}
h1,h2,h3,h4{margin:0;font-weight:700;color:var(--text-dark);}
h1{font-size:26px;letter-spacing:-.3px;}h2{font-size:19px;}h3{font-size:16px;}
p{margin:0;color:var(--text-mid);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::selection{background:var(--main-mint);color:var(--text-dark);}

/* ============ LAYOUT ============ */
#app{position:fixed;inset:0;overflow:hidden;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);}
.screen.active{display:flex;}
.header{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + var(--safe-top));min-height:56px;background:var(--surface);border-bottom:1px solid var(--border);z-index:50;flex-shrink:0;}
.header .title{flex:1;font-size:16px;font-weight:700;min-width:0;}
.header .title small{display:block;font-size:11px;font-weight:500;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px;padding-bottom:calc(24px + var(--safe-bottom));}
.content.tight{padding:12px;}

/* ============ COMPONENTS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-md);font-weight:600;font-size:14.5px;transition:transform .08s,background .15s;border:1px solid transparent;user-select:none;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--deep-teal);color:#fff;box-shadow:var(--shadow-sm);}
.btn-secondary{background:var(--light-green);color:var(--deep-teal);border-color:var(--teal-green);}
.btn-ghost{background:transparent;color:var(--text-mid);}
.btn-danger{background:#fbecec;color:var(--danger);border-color:#f1c9c9;}
[data-theme="dark"] .btn-danger{background:#2a1a1a;}
.btn-block{width:100%;}
.btn-icon{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-dark);flex-shrink:0;transition:background .15s;}
.btn-icon:hover{background:var(--light-green);}
.btn-icon svg{width:22px;height:22px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:13px;font-weight:600;color:var(--text-mid);}
.input,.select,.textarea{width:100%;min-height:50px;padding:0 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-dark);font-size:15px;transition:border-color .15s,box-shadow .15s;}
.textarea{min-height:96px;padding:12px 14px;resize:vertical;font-family:inherit;}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--teal-green);box-shadow:0 0 0 3px rgba(93,153,135,.15);}
.input.error{border-color:var(--danger);}
.err{color:var(--danger);font-size:12px;margin-top:-2px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm);}
.card+.card{margin-top:12px;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--light-green);color:var(--deep-teal);}
.divider{height:1px;background:var(--border);margin:14px 0;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:12px;color:var(--text-muted);}
.empty svg{width:56px;height:56px;color:var(--teal-green);opacity:.7;}
.empty h3{color:var(--text-dark);}
.empty p{font-size:13.5px;max-width:280px;}
.row{display:flex;gap:10px;align-items:center;}
.row.between{justify-content:space-between;}
.row.wrap{flex-wrap:wrap;}
.grow{flex:1;min-width:0;}
.muted{color:var(--text-muted);font-size:12.5px;}
.mid{color:var(--text-mid);font-size:13.5px;}
.stack>*+*{margin-top:10px;}
.gap-8>*+*{margin-top:8px;}

/* ============ TOAST ============ */
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--safe-bottom));z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px;}
.toast{background:var(--text-dark);color:var(--bg);padding:12px 16px;border-radius:var(--radius-md);box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:500;width:100%;animation:toastIn .22s cubic-bezier(.2,.9,.3,1.1);display:flex;align-items:center;gap:10px;}
.toast.success{background:var(--deep-teal);color:#fff;}
.toast.error{background:var(--danger);color:#fff;}
.toast.warn{background:var(--warning);color:#fff;}
.toast svg{width:18px;height:18px;flex-shrink:0;}
@keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

/* ============ MODAL ============ */
#modal-root{position:fixed;inset:0;z-index:8000;display:none;}
#modal-root.active{display:block;}
.modal-backdrop{position:absolute;inset:0;background:rgba(15,23,20,.5);animation:fade .18s;}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface);border-radius:var(--radius-xl);width:calc(100% - 32px);max-width:440px;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);animation:modalIn .22s cubic-bezier(.2,.9,.3,1.1);}
.modal-head{padding:20px 20px 8px;display:flex;align-items:center;gap:12px;}
.modal-head h2{font-size:18px;flex:1;}
.modal-body{padding:12px 20px 20px;}
.modal-foot{padding:0 20px 20px;display:flex;gap:10px;flex-wrap:wrap;}
.modal-foot .btn{flex:1;min-width:110px;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-45%) scale(.96);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}

/* ============ SHEET ============ */
#sheet-root{position:fixed;inset:0;z-index:8000;display:none;}
#sheet-root.active{display:block;}
.sheet-backdrop{position:absolute;inset:0;background:rgba(15,23,20,.5);animation:fade .18s;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 0 calc(20px + var(--safe-bottom));max-height:82vh;overflow:auto;animation:sheetIn .26s cubic-bezier(.2,.9,.3,1.1);box-shadow:var(--shadow-lg);}
.sheet-grab{width:38px;height:4px;background:var(--border);border-radius:4px;margin:6px auto 12px;}
.sheet-title{padding:0 20px 12px;font-size:16px;font-weight:700;}
.sheet-item{display:flex;align-items:center;gap:14px;padding:14px 20px;font-size:15px;color:var(--text-dark);}
.sheet-item:active{background:var(--light-green);}
.sheet-item svg{width:20px;height:20px;color:var(--teal-green);flex-shrink:0;}
@keyframes sheetIn{from{transform:translateY(100%);}to{transform:none;}}

/* ============ SPLASH ============ */
#screen-splash{align-items:center;justify-content:center;}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px;}
.splash-logo{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,var(--main-mint),var(--deep-teal));display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(64,128,113,.35);}
.splash-logo svg{width:44px;height:44px;color:#fff;}
.splash-brand{font-size:11px;font-weight:800;letter-spacing:.3em;color:var(--deep-teal);}
.splash-title{font-size:22px;}
.splash-loader{width:44px;height:3px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:20px;}
.splash-loader span{display:block;height:100%;width:40%;background:var(--deep-teal);animation:load 1.2s ease-in-out infinite;}
@keyframes load{0%{transform:translateX(-100%);}100%{transform:translateX(300%);}}

/* ============ HOME ============ */
.hero{padding:8px 0 20px;}
.hero h1{font-size:30px;letter-spacing:-.6px;margin:16px 0 8px;}
.hero p{font-size:15px;line-height:1.55;}
.proj-card{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm);transition:transform .1s;}
.proj-card:active{transform:scale(.985);}
.proj-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--soft-mint),var(--main-mint));display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--deep-teal);font-weight:800;font-size:22px;}
.proj-info{flex:1;min-width:0;}
.proj-name{font-weight:700;color:var(--text-dark);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.proj-pkg{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.proj-meta{font-size:11px;color:var(--text-muted);margin-top:6px;}
.proj-menu{width:36px;height:36px;flex-shrink:0;}

/* ============ FAB ============ */
.fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-bottom));width:56px;height:56px;border-radius:50%;background:var(--deep-teal);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(64,128,113,.4);z-index:100;transition:transform .12s;}
.fab:active{transform:scale(.92);}
.fab svg{width:26px;height:26px;}

/* ============ EDITOR ============ */
.editor-wrap{display:flex;flex-direction:column;flex:1;overflow:hidden;background:var(--surface);min-height:0;}
.tabs{display:flex;overflow-x:auto;background:var(--surface-2);border-bottom:1px solid var(--border);scrollbar-width:none;flex-shrink:0;}
.tabs::-webkit-scrollbar{display:none;}
.etab{display:flex;align-items:center;gap:8px;padding:0 14px;height:40px;font-size:13px;color:var(--text-mid);white-space:nowrap;border-right:1px solid var(--border);position:relative;flex-shrink:0;}
.etab.active{background:var(--surface);color:var(--text-dark);font-weight:600;}
.etab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--deep-teal);}
.etab .dot{width:7px;height:7px;border-radius:50%;background:var(--deep-teal);}
.etab .close{width:18px;height:18px;display:flex;align-items:center;justify-content:center;opacity:.55;font-size:16px;line-height:1;}
.etab .close:hover{opacity:1;}

.code-area{flex:1;position:relative;overflow:hidden;background:var(--surface);display:flex;min-height:0;}
.gutter{background:var(--surface-2);color:var(--text-muted);font-family:var(--font-mono);font-size:var(--code-fs);line-height:var(--line-h);padding:12px 8px 12px 12px;text-align:right;user-select:none;overflow:hidden;border-right:1px solid var(--border);min-width:48px;flex-shrink:0;}
.code-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;}
.code-inner{position:relative;min-width:100%;min-height:100%;}
.code-pre,.code-input{margin:0;font-family:var(--font-mono);font-size:var(--code-fs);line-height:var(--line-h);padding:12px 16px;white-space:pre;tab-size:2;min-height:100%;letter-spacing:0;}
.code-pre{color:var(--text-dark);pointer-events:none;min-width:max-content;}
.code-input{position:absolute;inset:0;background:transparent;color:transparent;caret-color:var(--deep-teal);border:0;resize:none;outline:none;overflow:hidden;width:100%;height:100%;min-width:max-content;font-weight:400;}
.code-input::selection{background:rgba(154,210,183,.55);color:transparent;}
.code-input.wrap,.code-pre.wrap{white-space:pre-wrap;word-break:break-word;}

.tok-tag{color:#2f7d63;}.tok-attr{color:#8a5a3d;}.tok-str{color:#b5583c;}
.tok-com{color:#8fa79a;font-style:italic;}.tok-kw{color:#7a4fa0;font-weight:600;}
.tok-num{color:#b06d2a;}.tok-fn{color:#2b5fa6;}.tok-prop{color:#2f7d63;}
.tok-sel{color:#2b5fa6;font-weight:600;}.tok-val{color:#b5583c;}
.tok-doctype{color:#8fa79a;}
[data-theme="dark"] .tok-tag{color:#7fd3a8;}[data-theme="dark"] .tok-attr{color:#e0b088;}
[data-theme="dark"] .tok-str{color:#f0a08a;}[data-theme="dark"] .tok-com{color:#6b7d73;}
[data-theme="dark"] .tok-kw{color:#c8a5f0;}[data-theme="dark"] .tok-num{color:#e0b676;}
[data-theme="dark"] .tok-fn{color:#8fb8f0;}[data-theme="dark"] .tok-prop{color:#7fd3a8;}
[data-theme="dark"] .tok-sel{color:#8fb8f0;}[data-theme="dark"] .tok-val{color:#f0a08a;}

.diag{background:var(--surface-2);border-top:1px solid var(--border);max-height:160px;overflow:auto;font-family:var(--font-mono);font-size:12px;flex-shrink:0;}
.diag-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-size:11px;font-weight:700;color:var(--text-mid);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);}
.diag-item{padding:8px 14px;display:flex;gap:10px;border-bottom:1px solid var(--border);}
.diag-item.err{color:var(--danger);}
.diag-item.warn{color:var(--warning);}
.diag-item .loc{color:var(--text-muted);flex-shrink:0;}
.diag-empty{padding:14px;color:var(--text-muted);font-size:12px;text-align:center;}

/* ============ PREVIEW ============ */
.preview-wrap{flex:1;background:var(--surface-2);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;min-height:0;}
.preview-frame{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid var(--border);width:100%;height:100%;display:flex;flex-direction:column;transition:max-width .2s,max-height .2s;}
.preview-frame.phone{max-width:390px;max-height:780px;}
.preview-frame.tablet{max-width:600px;max-height:820px;}
.preview-frame.full{max-width:none;max-height:none;border-radius:0;box-shadow:none;border:0;}
.preview-frame iframe{flex:1;border:0;width:100%;height:100%;background:#fff;}
.console{background:#0F1714;color:#D3ECD3;font-family:var(--font-mono);font-size:12px;padding:10px 14px;max-height:150px;overflow:auto;border-top:1px solid var(--border);flex-shrink:0;}
.console .c-item{padding:3px 0;display:flex;gap:8px;border-bottom:1px solid rgba(255,255,255,.05);}
.console .c-item.warn{color:#F0C878;}.console .c-item.error{color:#F09C9C;}
.console .c-time{color:#5D9987;flex-shrink:0;}
.preview-toolbar{display:flex;gap:6px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--border);overflow-x:auto;flex-shrink:0;}
.preview-toolbar .btn{padding:0 12px;min-height:40px;font-size:13px;}

/* ============ FILE EXPLORER ============ */
.explorer{background:var(--surface);border-bottom:1px solid var(--border);max-height:42vh;overflow:auto;flex-shrink:0;}
.fnode{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:14px;color:var(--text-dark);cursor:pointer;}
.fnode:active{background:var(--light-green);}
.fnode svg{width:18px;height:18px;flex-shrink:0;}
.fnode.dir svg{color:var(--teal-green);}
.fnode.file svg{color:var(--text-muted);}
.fnode.active{background:var(--light-green);color:var(--deep-teal);font-weight:600;}
.fnode .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fnode .mini{font-size:10px;color:var(--text-muted);}
.fnode.depth-1{padding-left:32px;}
.fnode.depth-2{padding-left:48px;}
.fnode.depth-3{padding-left:64px;}

/* ============ TERMINAL ============ */
.term{background:#0F1714;color:#D3ECD3;font-family:var(--font-mono);font-size:12px;padding:14px;border-radius:var(--radius-md);max-height:280px;overflow:auto;line-height:1.6;}
.term .t-line{display:block;white-space:pre-wrap;word-break:break-word;}
.term .t-info{color:#9AD2B7;}.term .t-warn{color:#F0C878;}.term .t-err{color:#F09C9C;}
.progress{height:6px;background:var(--border);border-radius:6px;overflow:hidden;}
.progress>i{display:block;height:100%;background:var(--deep-teal);width:0%;transition:width .3s;}

/* ============ MISC ============ */
.hidden{display:none!important;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);gap:12px;}
.settings-row:first-child{border-top-left-radius:var(--radius-md);border-top-right-radius:var(--radius-md);}
.settings-row:last-child{border-bottom-left-radius:var(--radius-md);border-bottom-right-radius:var(--radius-md);border-bottom:0;}
.settings-label{font-size:14px;color:var(--text-dark);}
.settings-label small{display:block;font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.switch{position:relative;width:44px;height:26px;background:var(--border);border-radius:20px;transition:background .2s;flex-shrink:0;}
.switch.on{background:var(--deep-teal);}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.on::after{transform:translateX(18px);}
.segment{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;}
.segment button{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-mid);}
.segment button.active{background:var(--surface);color:var(--deep-teal);box-shadow:var(--shadow-sm);}
</style>
</head>
<body>

<div id="app">
  <div id="screen-splash" class="screen active">
    <div class="splash-inner">
      <div class="splash-logo" id="splashLogo"></div>
      <div class="splash-brand">ZISHU TRON</div>
      <h1 class="splash-title">Zishu App Creator</h1>
      <div class="splash-loader"><span></span></div>
    </div>
  </div>
  <div id="screen-root"></div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="sheet-root"></div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
var ICONS = (function(){
  function svg(p, vb){return '<svg viewBox="'+(vb||'0 0 24 24')+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
  return {
    home:svg('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'),
    back:svg('<path d="M15 6l-6 6 6 6"/>'),
    folder:svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>'),

/* =========================================================
   UTILS
   ========================================================= */
var U = {
  $:function(s,r){return (r||document).querySelector(s);},
  $$:function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));},
  el:function(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;},
  esc:function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});},
  uid:function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);},
  debounce:function(fn,ms){var t;return function(){var a=arguments,c=this;clearTimeout(t);t=setTimeout(function(){fn.apply(c,a);},ms);};},
  timeAgo:function(ts){
    if(!ts)return'';
    var d=Date.now()-ts;
    if(d<60000)return'just now';
    if(d<3600000)return Math.floor(d/60000)+'m ago';
    if(d<86400000)return Math.floor(d/3600000)+'h ago';
    if(d<604800000)return Math.floor(d/86400000)+'d ago';
    return new Date(ts).toLocaleDateString();
  },
  fileExt:function(name){var i=name.lastIndexOf('.');return i<0?'':name.slice(i+1).toLowerCase();},
  fileType:function(name){
    var e=U.fileExt(name);
    if(e==='html'||e==='htm')return'html';
    if(e==='css')return'css';
    if(e==='js'||e==='mjs')return'js';
    if(e==='json')return'json';
    return'text';
  },
  iconForFile:function(name){
    var t=U.fileType(name);
    if(t==='html')return ICONS.html;
    if(t==='css')return ICONS.css;
    if(t==='js')return ICONS.js;
    if(t==='json')return ICONS.json;
    return ICONS.file;
  },
  validPackage:function(p){return /^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(p);}
};

/* =========================================================
   BRIDGE  (ZishuNative)
   Browser fallback implementation + native detection
   ========================================================= */
var ZishuNative = (function(){
  var native = null;
  if(typeof window.Android!=='undefined') native=window.Android;
  else if(typeof window.ZishuAndroid!=='undefined') native=window.ZishuAndroid;
  else if(typeof window.ZishuNativeAndroid!=='undefined') native=window.ZishuNativeAndroid;

  var isNative = !!native;

  function call(name,args,fallback){
    try{
      if(native && typeof native[name]==='function'){
        return native[name].apply(native,args||[]);
      }
    }catch(e){ console.warn('[ZishuNative] '+name+' error',e); }
    return fallback ? fallback() : null;
  }

  return {
    isNative:isNative,
    getDeviceInfo:function(){return call('getDeviceInfo',[],function(){return JSON.stringify({platform:'browser',ua:navigator.userAgent});});},
    showToast:function(msg){return call('showToast',[String(msg)],function(){UI.toast(String(msg));});},
    vibrate:function(ms){return call('vibrate',[ms||30],function(){if(navigator.vibrate)navigator.vibrate(ms||30);});},
    shareText:function(text){return call('shareText',[String(text)],function(){
      if(navigator.share){navigator.share({text:String(text)}).catch(function(){});}
      else{UI.toast('Sharing not available');}
    });},
    shareFile:function(path){return call('shareFile',[String(path)],function(){UI.toast('Sharing files requires Android bridge.');});},
    openUrl:function(url){return call('openUrl',[String(url)],function(){window.open(url,'_blank');});},
    pickFile:function(opts){return call('pickFile',[JSON.stringify(opts||{})],function(){return null;});},
    saveFile:function(opts){return call('saveFile',[JSON.stringify(opts||{})],function(){return null;});},
    readFile:function(path){return call('readFile',[String(path)],function(){return null;});},
    writeFile:function(path,content){return call('writeFile',[String(path),String(content)],function(){return false;});},
    deleteFile:function(path){return call('deleteFile',[String(path)],function(){return false;});},
    listFiles:function(path){return call('listFiles',[String(path)],function(){return'[]';});},
    requestPermission:function(p){return call('requestPermission',[String(p)],function(){return false;});},
    getPermissionStatus:function(p){return call('getPermissionStatus',[String(p)],function(){return'unknown';});},
    showNotification:function(opts){return call('showNotification',[JSON.stringify(opts||{})],function(){UI.toast((opts&&opts.title)||'Notification');});},
    setStatusBar:function(opts){return call('setStatusBar',[JSON.stringify(opts||{})],null);},
    setNavigationBar:function(opts){return call('setNavigationBar',[JSON.stringify(opts||{})],null);},
    setClipboard:function(t){return call('setClipboard',[String(t)],function(){if(navigator.clipboard)navigator.clipboard.writeText(t).catch(function(){});});},
    getClipboard:function(){return call('getClipboard',[],function(){return null;});},
    openCamera:function(o){return call('openCamera',[JSON.stringify(o||{})],function(){return null;});},
    recordAudio:function(o){return call('recordAudio',[JSON.stringify(o||{})],function(){return null;});},
    chooseImage:function(o){return call('chooseImage',[JSON.stringify(o||{})],function(){return null;});},
    getDeviceStorageInfo:function(){return call('getDeviceStorageInfo',[],function(){return JSON.stringify({});});},
    buildProject:function(projectData){
      return call('buildProject',[JSON.stringify(projectData)],function(){
        // Browser fallback — DO NOT fake success
        ZishuNative._emitBuild({
          status:'native-required',
          message:'APK building requires the Android native build bridge. The build request has been prepared.'
        });
        return null;
      });
    },
    installApk:function(path){return call('installApk',[String(path)],function(){UI.toast('Install requires Android bridge.');});},
    shareApk:function(path){return call('shareApk',[String(path)],function(){UI.toast('Share requires Android bridge.');});},
    downloadApk:function(path){return call('downloadApk',[String(path)],function(){UI.toast('Download requires Android bridge.');});},
    openAppSettings:function(){return call('openAppSettings',[],function(){UI.toast('App settings require Android bridge.');});},
    closeApp:function(){return call('closeApp',[],function(){UI.toast('Cannot close browser tab.');});},

    /* Event system */
    _emitBuild:function(detail){
      try{window.dispatchEvent(new CustomEvent('zishu:build-progress',{detail:detail}));}catch(e){}
    },
    _emit:function(type,detail){
      try{window.dispatchEvent(new CustomEvent('zishu:'+type,{detail:detail}));}catch(e){}
    }
  };
})();
window.ZishuNative = ZishuNative;

/* =========================================================
   STORAGE (IndexedDB + localStorage prefs)
   ========================================================= */
var Storage = (function(){
  var DB_NAME='zishu_app_creator', DB_VER=1;
  var STORE_PROJECTS='projects', STORE_FILES='files', STORE_META='meta';
  var db=null;

  function open(){
    return new Promise(function(res,rej){
      var r=indexedDB.open(DB_NAME,DB_VER);
      r.onupgradeneeded=function(e){
        var d=e.target.result;
        if(!d.objectStoreNames.contains(STORE_PROJECTS)) d.createObjectStore(STORE_PROJECTS,{keyPath:'id'});
        if(!d.objectStoreNames.contains(STORE_FILES)) d.createObjectStore(STORE_FILES,{keyPath:'id'});
        if(!d.objectStoreNames.contains(STORE_META)) d.createObjectStore(STORE_META,{keyPath:'key'});
      };
      r.onsuccess=function(){db=r.result;res(db);};
      r.onerror=function(){rej(r.error);};
    });
  }
  function tx(store,mode){return db.transaction(store,mode).objectStore(store);}
  function req(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}

  return {
    init:function(){return db?Promise.resolve():open();},
    putProject:function(p){return req(tx(STORE_PROJECTS,'readwrite').put(p));},
    getProject:function(id){return req(tx(STORE_PROJECTS,'readonly').get(id));},
    allProjects:function(){return req(tx(STORE_PROJECTS,'readonly').getAll());},
    delProject:function(id){return req(tx(STORE_PROJECTS,'readwrite').delete(id));},
    putFile:function(f){return req(tx(STORE_FILES,'readwrite').put(f));},
    getFiles:function(pid){
      return req(tx(STORE_FILES,'readonly').getAll()).then(function(all){return all.filter(function(f){return f.projectId===pid;});});
    },
    delFile:function(id){return req(tx(STORE_FILES,'readwrite').delete(id));},
    setMeta:function(k,v){return req(tx(STORE_META,'readwrite').put({key:k,value:v}));},
    getMeta:function(k){return req(tx(STORE_META,'readonly').get(k)).then(function(r){return r?r.value:null;});},
    prefs:{
      get:function(k,d){try{var v=localStorage.getItem('zishu.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
      set:function(k,v){try{localStorage.setItem('zishu.'+k,JSON.stringify(v));}catch(e){}}
    }
  };
})();

/* =========================================================
   UI (toast, modal, sheet, dialog)
   ========================================================= */
var UI = (function(){
  var toastRoot=document.getElementById('toast-root');
  var modalRoot=document.getElementById('modal-root');
  var sheetRoot=document.getElementById('sheet-root');

  function toast(msg,type){
    var el=U.el('div','toast'+(type?' '+type:''),
      (type==='success'?ICONS.check:type==='error'?ICONS.warn:ICONS.info)+'<span>'+U.esc(msg)+'</span>');
    toastRoot.appendChild(el);
    setTimeout(function(){el.style.opacity='0';el.style.transition='opacity .25s';setTimeout(function(){el.remove();},260);},2200);
  }

  function modal(opts){
    // opts: {title, body(html), actions:[{label,cls,onClick}], onClose}
    modalRoot.innerHTML='';
    var back=U.el('div','modal-backdrop');
    var m=U.el('div','modal');
    var head=U.el('div','modal-head','<h2>'+U.esc(opts.title||'')+'</h2>');
    var body=U.el('div','modal-body');body.innerHTML=opts.body||'';
    var foot=U.el('div','modal-foot');
    (opts.actions||[]).forEach(function(a){
      var b=U.el('button','btn '+(a.cls||'btn-ghost'),U.esc(a.label));
      b.onclick=function(){if(a.onClick)a.onClick(m);};
      foot.appendChild(b);
    });
    m.appendChild(head);m.appendChild(body);
    if(opts.actions&&opts.actions.length)m.appendChild(foot);
    modalRoot.appendChild(back);modalRoot.appendChild(m);
    modalRoot.classList.add('active');
    back.onclick=function(){close();};
    function close(){modalRoot.classList.remove('active');modalRoot.innerHTML='';if(opts.onClose)opts.onClose();}
    return {close:close,body:body,modal:m};
  }

  function sheet(opts){
    sheetRoot.innerHTML='';
    var back=U.el('div','sheet-backdrop');
    var s=U.el('div','sheet');
    s.appendChild(U.el('div','sheet-grab'));
    if(opts.title)s.appendChild(U.el('div','sheet-title',U.esc(opts.title)));
    (opts.items||[]).forEach(function(it){
      var row=U.el('div','sheet-item',(it.icon||'')+'<span>'+U.esc(it.label)+'</span>');
      row.onclick=function(){close();if(it.onClick)setTimeout(it.onClick,50);};
      s.appendChild(row);
    });
    sheetRoot.appendChild(back);sheetRoot.appendChild(s);
    sheetRoot.classList.add('active');
    back.onclick=close;
    function close(){sheetRoot.classList.remove('active');sheetRoot.innerHTML='';}
    return {close:close};
  }

  function confirm(title,message,onYes,yesLabel){
    modal({
      title:title,
      body:'<p class="mid">'+U.esc(message)+'</p>',
      actions:[
        {label:'Cancel',cls:'btn-ghost',onClick:function(m){m.parentNode.querySelector('.modal-backdrop');UI.closeModal();}},
        {label:yesLabel||'Confirm',cls:'btn-danger',onClick:function(){UI.closeModal();onYes();}}
      ]
    });
  }

  function closeModal(){modalRoot.classList.remove('active');modalRoot.innerHTML='';}
  function closeSheet(){sheetRoot.classList.remove('active');sheetRoot.innerHTML='';}

  return {toast:toast,modal:modal,sheet:sheet,confirm:confirm,closeModal:closeModal,closeSheet:closeSheet};
})();

/* =========================================================
   HIGHLIGHTER
   ========================================================= */
var Highlighter = (function(){
  function esc(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

  function html(src){
    // tokenize naive but stable
    var out='';
    var i=0;
    var re=/<!--[\s\S]*?-->|<!DOCTYPE[^>]*>|<\/?[a-zA-Z][^>]*>/g;
    var last=0,m;
    while((m=re.exec(src))){
      out+=esc(src.slice(last,m.index));
      var tag=m[0];
      if(tag.indexOf('<!--')===0){out+='<span class="tok-com">'+esc(tag)+'</span>';}
      else if(tag.indexOf('<!DOCTYPE')===0){out+='<span class="tok-doctype">'+esc(tag)+'</span>';}
      else{
        // highlight tag
        var inner=esc(tag);
        inner=inner.replace(/(&lt;\/?)([a-zA-Z][a-zA-Z0-9-]*)/,'$1<span class="tok-tag">$2</span>');
        inner=inner.replace(/([a-zA-Z-]+)=(&quot;[^&]*&quot;|&#39;[^&]*&#39;)/g,'<span class="tok-attr">$1</span>=<span class="tok-str">$2</span>');
        out+=inner;
      }
      last=m.index+tag.length;
    }
    out+=esc(src.slice(last));
    return out;
  }

  function css(src){
    var out=esc(src);
    // comments
    out=out.replace(/\/\*[\s\S]*?\*\//g,function(m){return '<span class="tok-com">'+m+'</span>';});
    // at-rules
    out=out.replace(/@[a-zA-Z-]+/g,function(m){return '<span class="tok-kw">'+m+'</span>';});
    // strings
    out=out.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g,function(m){return '<span class="tok-str">'+m+'</span>';});
    // selectors before { — do a simple pass: highlight word before {
    out=out.replace(/([^{}\/;]+)\{/g,function(_,sel){
      return '<span class="tok-sel">'+sel+'</span>{';
    });
    // properties
    out=out.replace(/([a-zA-Z-]+)\s*:\s*([^;{}]+);/g,function(_,p,v){
      // keep existing spans inside v
      return '<span class="tok-prop">'+p+'</span>: <span class="tok-val">'+v+'</span>;';
    });
    // numbers
    out=out.replace(/\b(\d+\.?\d*(px|em|rem|%|vh|vw|s|ms|deg)?)\b/g,'<span class="tok-num">$1</span>');
    return out;
  }

  function js(src){
    var out=esc(src);
    var tokens=[
      [/\/\/[^\n]*/g,'com'],
      [/\/\*[\s\S]*?\*\//g,'com'],
      [/(&quot;[^&\n]*?&quot;|&#39;[^&\n]*?&#39;|`[^`]*?`)/g,'str'],
      [/\b(var|let|const|function|return|if|else|for|while|do|switch|case|break|continue|new|this|typeof|instanceof|in|of|try|catch|finally|throw|class|extends|super|import|export|from|default|async|await|yield|delete|void|null|undefined|true|false)\b/g,'kw'],
      [/\b(\d+\.?\d*)\b/g,'num'],
      [/\b([a-zA-Z_$][\w$]*)\s*\(/g,'fn'],
    ];
    // simple order: comments first (they can contain everything)
    var parts=[];
    var pos=0;
    var master=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|&quot;[^&\n]*?&quot;|&#39;[^&\n]*?&#39;|`[^`]*?`)/g;
    var m,last=0,res='';
    while((m=master.exec(out))){
      res+=out.slice(last,m.index).replace(/\b(var|let|const|function|return|if|else|for|while|do|switch|case|break|continue|new|this|typeof|instanceof|in|of|try|catch|finally|throw|class|extends|super|import|export|from|default|async|await|yield|delete|void|null|undefined|true|false)\b/g,'<span class="tok-kw">$1</span>')
        .replace(/\b([a-zA-Z_$][\w$]*)\s*\(/g,'<span class="tok-fn">$1</span>(')
        .replace(/\b(\d+\.?\d*)\b/g,'<span class="tok-num">$1</span>');
      var tk=m[0];
      var cls=tk.indexOf('//')===0||tk.indexOf('/*')===0?'tok-com':'tok-str';
      res+='<span class="'+cls+'">'+tk+'</span>';
      last=m.index+tk.length;
    }
    res+=out.slice(last).replace(/\b(var|let|const|function|return|if|else|for|while|do|switch|case|break|continue|new|this|typeof|instanceof|in|of|try|catch|finally|throw|class|extends|super|import|export|from|default|async|await|yield|delete|void|null|undefined|true|false)\b/g,'<span class="tok-kw">$1</span>')
      .replace(/\b([a-zA-Z_$][\w$]*)\s*\(/g,'<span class="tok-fn">$1</span>(')
      .replace(/\b(\d+\.?\d*)\b/g,'<span class="tok-num">$1</span>');
    return res;
  }

  function json(src){
    var out=esc(src);
    // keys
    out=out.replace(/(&quot;[^&]*?&quot;)\s*:/g,'<span class="tok-kw">$1</span>:');
    // strings
    out=out.replace(/(:\s*)(&quot;[^&]*?&quot;)/g,'$1<span class="tok-str">$2</span>');
    // booleans/numbers
    out=out.replace(/\b(true|false|null)\b/g,'<span class="tok-kw">$1</span>');
    out=out.replace(/\b(\d+\.?\d*)\b/g,'<span class="tok-num">$1</span>');
    return out;
  }

  return {
    run:function(code,type){
      try{
        if(type==='html')return html(code);
        if(type==='css')return css(code);
        if(type==='js')return js(code);
        if(type==='json')return json(code);
        return esc(code);
      }catch(e){return esc(code);}
    }
  };
})();

/* =========================================================
   PREVIEW (compiles project files into a self-contained HTML)
   ========================================================= */
var Preview = (function(){
  var consoleBuffer=[];
  var consoleCallbacks=[];

  function buildPreviewHtml(files){
    var index=files.filter(function(f){return f.name==='index.html';})[0]||files.filter(function(f){return f.type==='html';})[0];
    if(!index)return '<!DOCTYPE html><html><body style="font-family:sans-serif;padding:40px;color:#4D635A;text-align:center;"><h2 style="color:#1F2D27;">No index.html found</h2><p>Create an index.html to preview your project.</p></body></html>';

    var html=index.content||'';

    // collect css files
    var cssFiles=files.filter(function(f){return f.type==='css';});
    var jsFiles=files.filter(function(f){return f.type==='js';});

    // strip/rewrite <link rel=stylesheet> to inline
    html=html.replace(/<link[^>]*href=["']([^"']+\.css)["'][^>]*>/gi,function(_,href){
      var name=href.split('/').pop();
      var f=cssFiles.filter(function(x){return x.name===name||x.path.endsWith('/'+name);})[0];
      if(f)return '<style data-zishu="'+name+'">\n'+f.content+'\n</style>';
      return '';
    });

    // strip/rewrite <script src>
    html=html.replace(/<script[^>]*src=["']([^"']+\.js)["'][^>]*>\s*<\/script>/gi,function(_,src){
      var name=src.split('/').pop();
      var f=jsFiles.filter(function(x){return x.name===name||x.path.endsWith('/'+name);})[0];
      if(f)return '<script data-zishu="'+name+'">\n'+f.content+'\n<\/script>';
      return '';
    });

    // Inject remaining css files not already inlined
    var inlinedCss=cssFiles.map(function(f){return f.name;}).join(',');
    var remainingCss=cssFiles.filter(function(f){
      return html.indexOf('data-zishu="'+f.name+'"')<0;
    });
    if(remainingCss.length){
      var cssBlock=remainingCss.map(function(f){return '/* '+f.name+' */\n'+f.content;}).join('\n\n');
      if(/<\/head>/i.test(html)) html=html.replace(/<\/head>/i,'<style>\n'+cssBlock+'\n</style>\n</head>');
      else html='<style>\n'+cssBlock+'\n</style>\n'+html;
    }

    // Inject remaining js files
    var remainingJs=jsFiles.filter(function(f){
      return html.indexOf('data-zishu="'+f.name+'"')<0;
    });
    if(remainingJs.length){
      var jsBlock=remainingJs.map(function(f){return '/* '+f.name+' */\n'+f.content;}).join('\n\n');
      if(/<\/body>/i.test(html)) html=html.replace(/<\/body>/i,'<script>\n'+jsBlock+'\n<\/script>\n</body>');
      else html+='<script>\n'+jsBlock+'\n<\/script>';
    }

    // console capture
    var capture='<script>(function(){'+
      'var send=function(t,a){try{parent.postMessage({__zishuConsole:true,type:t,args:a},\'*\');}catch(e){}};'+
      'var _l=console.log,_w=console.warn,_e=console.error;'+
      'console.log=function(){send(\'log\',[].slice.call(arguments));_l.apply(console,arguments);};'+
      'console.warn=function(){send(\'warn\',[].slice.call(arguments));_w.apply(console,arguments);};'+
      'console.error=function(){send(\'error\',[].slice.call(arguments));_e.apply(console,arguments);};'+
      'window.onerror=function(m,s,l,c){send(\'error\',[m+\' (\'+l+\':\'+c+\')\']);};'+
      '})();<\/script>';

    if(/<head>/i.test(html))html=html.replace(/<head>/i,'<head>'+capture);
    else html=capture+html;

    return html;
  }

  return {build:buildPreviewHtml};
})();

/* =========================================================
   ROUTER
   ========================================================= */
var Router = (function(){
  var stack=[];
  var screens={};

  function register(name,renderFn){screens[name]=renderFn;}
  function show(name,params){
    var root=document.getElementById('screen-root');
    root.innerHTML='';
    var s=U.el('div','screen active');
    root.appendChild(s);
    screens[name](s,params||{});
  }
  function push(name,params){stack.push({name:name,params:params});show(name,params);}
  function back(){
    if(stack.length>1){stack.pop();var last=stack[stack.length-1];show(last.name,last.params);}
  }
  function reset(name,params){stack=[{name:name,params:params}];show(name,params);}
  function current(){return stack[stack.length-1];}
  function canBack(){return stack.length>1;}

  return {register:register,show:show,push:push,back:back,reset:reset,current:current,canBack:canBack};
})();

/* =========================================================
   EDITOR (view)
   ========================================================= */
var EditorView = (function(){
  var state={
    editor:null,pre:null,gutter:null,scroll:null,
    onInput:null,onSave:null,onSelection:null
  };

  function render(host,file,opts){
    opts=opts||{};
    host.innerHTML='';
    var wrap=U.el('div','editor-wrap');

    // tabs
    var tabs=U.el('div','tabs');
    // (tabs filled by caller via refreshTabs)

    // code area
    var area=U.el('div','code-area');
    var gutter=U.el('div','gutter','1');
    var scroll=U.el('div','code-scroll');
    var inner=U.el('div','code-inner');
    var pre=U.el('pre','code-pre');
    var input=U.el('textarea','code-input');
    input.spellcheck=false;
    input.autocapitalize='off';
    input.autocomplete='off';
    input.setAttribute('autocorrect','off');

    inner.appendChild(pre);
    inner.appendChild(input);
    scroll.appendChild(inner);
    area.appendChild(gutter);area.appendChild(scroll);

    wrap.appendChild(tabs);wrap.appendChild(area);
    host.appendChild(wrap);

    state.editor=input;state.pre=pre;state.gutter=gutter;state.scroll=scroll;state.tabs=tabs;

    input.value=file.content||'';
    sync();

    input.addEventListener('input',function(){
      sync();
      if(state.onInput)state.onInput();
    });
    input.addEventListener('scroll',function(){
      scroll.scrollTop=input.scrollTop;
      scroll.scrollLeft=input.scrollLeft;
      gutter.scrollTop=input.scrollTop;
    });
    scroll.addEventListener('scroll',function(){
      input.scrollTop=scroll.scrollTop;
      input.scrollLeft=scroll.scrollLeft;
    });
    input.addEventListener('keydown',function(e){
      handleKey(e);
    });

    // apply settings
    applySettings();
  }

  function applySettings(){
    var s=Settings.get();
    document.documentElement.style.setProperty('--code-fs',s.fontSize+'px');
    document.documentElement.style.setProperty('--line-h',(s.fontSize+8)+'px');
    if(state.editor){
      if(s.wordWrap){state.editor.classList.add('wrap');state.pre.classList.add('wrap');}
      else{state.editor.classList.remove('wrap');state.pre.classList.remove('wrap');}
      state.editor.style.tabSize=s.tabSize;
      state.pre.style.tabSize=s.tabSize;
    }
  }

  function sync(){
    if(!state.editor)return;
    var code=state.editor.value;
    var f=PM.get()?PM.get().files.filter(function(x){return x.id===PM.activeFileId;})[0]:null;
    var type=f?f.type:'text';
    if(Settings.get().syntaxHighlight){
      state.pre.innerHTML=Highlighter.run(code,type)+'\n';
    }else{
      state.pre.textContent=code+'\n';
    }
    // line numbers
    var lines=code.split('\n').length;
    var html='';
    for(var i=1;i<=lines;i++)html+=i+(i<lines?'\n':'');
    state.gutter.textContent=html;
  }

  function handleKey(e){
    var s=Settings.get();
    // Tab
    if(e.key==='Tab'){
      e.preventDefault();
      insertText('  ');
      return;
    }
    // Auto-close brackets
    if(s.autoCloseBrackets){
      var pairs={'(' :')','[':']','{':'}','"':'"',"'":"'"};
      if(pairs[e.key]){
        e.preventDefault();
        insertText(e.key+pairs[e.key]);
        var p=state.editor.selectionStart-1;
        state.editor.setSelectionRange(p,p);
        sync();
        return;
      }
    }
    // Enter auto-indent
    if(e.key==='Enter'&&s.autoIndent){
      var val=state.editor.value;
      var pos=state.editor.selectionStart;
      var lineStart=val.lastIndexOf('\n',pos-1)+1;
      var line=val.slice(lineStart,pos);
      var indent=line.match(/^[ \t]*/)[0];
      e.preventDefault();
      insertText('\n'+indent);
      return;
    }
  }

  function insertText(text){
    var ed=state.editor;
    var s=ed.selectionStart,e=ed.selectionEnd;
    var v=ed.value;
    ed.value=v.slice(0,s)+text+v.slice(e);
    ed.selectionStart=ed.selectionEnd=s+text.length;
    sync();
    if(state.onInput)state.onInput();
  }

  function getCode(){return state.editor?state.editor.value:'';}
  function setCode(code){if(state.editor){state.editor.value=code;sync();}}
  function refreshTabs(files,activeId,onSelect,onClose){
    if(!state.tabs)return;
    state.tabs.innerHTML='';
    files.forEach(function(f){
      var isActive=f.id===activeId;
      var isDirty=PM.isDirty(f.id);
      var tab=U.el('div','etab'+(isActive?' active':''),
        U.iconForFile(f.name)+'<span>'+U.esc(f.name)+'</span>'+
        (isDirty?'<span class="dot"></span>':'<span class="close">×</span>'));
      tab.onclick=function(ev){
        if(ev.target.classList.contains('close')){ev.stopPropagation();if(onClose)onClose(f.id);return;}
        if(onSelect)onSelect(f.id);
      };
      state.tabs.appendChild(tab);
    });
  }

  return {
    render:render,
    sync:sync,
    applySettings:applySettings,
    getCode:getCode,
    setCode:setCode,
    refreshTabs:refreshTabs,
    state:state
  };
})();

/* =========================================================
   SETTINGS
   ========================================================= */
var Settings = (function(){
  var defaults={
    theme:'light',
    fontSize:13,
    fontFamily:'mono',
    tabSize:2,
    useTabs:false,
    wordWrap:false,
    lineNumbers:true,
    syntaxHighlight:true,
    autoSave:true,
    autoCloseBrackets:true,
    autoIndent:true
  };
  var current=null;

  function load(){
    var stored=Storage.prefs.get('settings',{});
    current=Object.assign({},defaults,stored);
    applyTheme(current.theme);
    return current;
  }
  function save(){Storage.prefs.set('settings',current);}
  function get(){return current||load();}
  function set(k,v){current[k]=v;save();if(k==='theme')applyTheme(v);if(EditorView&&EditorView.applySettings)EditorView.applySettings();}
  function reset(){current=Object.assign({},defaults);save();applyTheme(current.theme);if(EditorView&&EditorView.applySettings)EditorView.applySettings();}
  function applyTheme(t){
    if(t==='system')t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);
  }
  return {load:load,get:get,set:set,reset:reset,applyTheme:applyTheme,defaults:defaults};
})();

/* =========================================================
   DIAGNOSTICS
   ========================================================= */
var Diagnostics = (function(){
  function analyze(file){
    var issues=[];
    var content=file.content||'';
    if(file.type==='html'){
      var open=0,line=1;
      var re=/<\/?([a-zA-Z][a-zA-Z0-9-]*)[^>]*>/g,m;
      var voidTags={br:1,hr:1,img:1,input:1,meta:1,link:1,area:1,base:1,col:1,embed:1,source:1,track:1,wbr:1};
      while((m=re.exec(content))){
        var tag=m[1].toLowerCase();
        if(voidTags[tag])continue;
        if(m[0].indexOf('</')===0)open--;
        else open++;
        if(open<0){issues.push({sev:'err',file:file.name,line:lineOf(content,m.index),msg:'Unexpected closing tag </'+tag+'>'});open=0;}
      }
    }
    if(file.type==='css'){
      var braces=(content.match(/\{/g)||[]).length-(content.match(/\}/g)||[]).length;
      if(braces!==0)issues.push({sev:'err',file:file.name,line:1,msg:'Unbalanced braces: '+(braces>0?'missing }':'extra }')});
    }
    if(file.type==='js'){
      try{new Function(content);}
      catch(e){issues.push({sev:'err',file:file.name,line:1,msg:(e.message||'Syntax error')});}
    }
    return issues;
  }
  function lineOf(text,index){return text.slice(0,index).split('\n').length;}
  return {analyze:analyze};
})();

        versionName:project.versionName,versionCode:project.versionCode,

  function start(onProgress){

    ZishuNative.buildProject(payload);
  }
  return {collect:collect,start:start};
})();

  Storage.getFiles(p.id).then(function(files){
    var bundle={project:p,files:files,exportedAt:Date.now(),version:1};

    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    UI.toast('Project exported','success');
  });
}

function openEditor(projectId,fileId){
  Storage.getProject(projectId).then(function(p){
    Storage.getFiles(projectId).then(function(files){
      PM.set({project:p,files:files});
      if(fileId){
        PM.openTabs.length=0;PM.openTabs.push(fileId);PM.setActiveFileId(fileId);
      }else if(files.length){
        PM.openTabs.length=0;PM.openTabs.push(files[0].id);PM.setActiveFileId(files[0].id);
      }
      Router.push('editor',{projectId:projectId});
    });
  });
}

Router.register('editor',function(host,params){
  var p=PM.get();
  if(!p){Router.reset('home');return;}
  var project=p.project;
  var files=p.files;

  var header=U.el('div','header');
  var back=U.el('button','btn-icon',ICONS.back);back.onclick=function(){Router.reset('home');};
  header.appendChild(back);

  function activeFile(){return files.filter(function(f){return f.id===PM.activeFileId;})[0];}
  var titleEl=U.el('div','title');
  function updateTitle(){
    var f=activeFile();
    titleEl.innerHTML=(f?U.esc(f.name):'No file')+'<small>'+U.esc(project.name)+'</small>';
  }
  header.appendChild(titleEl);

  var saveBtn=U.el('button','btn-icon',ICONS.save);saveBtn.onclick=function(){saveActive();UI.toast('Saved','success');};
  var prevBtn=U.el('button','btn-icon',ICONS.preview);prevBtn.onclick=function(){Router.push('preview',{projectId:project.id});};
  var moreBtn=U.el('button','btn-icon',ICONS.menu);moreBtn.onclick=function(){editorMenu(project,files);};
  header.appendChild(saveBtn);header.appendChild(prevBtn);header.appendChild(moreBtn);
  host.appendChild(header);

  // Explorer (collapsible)
  var explorer=U.el('div','explorer');
  explorer.classList.add('hidden');
  host.appendChild(explorer);

  var editorHost=U.el('div','grow');editorHost.style.display='flex';editorHost.style.flexDirection='column';editorHost.style.minHeight='0';
  host.appendChild(editorHost);

  // Diagnostics
  var diag=U.el('div','diag');
  diag.innerHTML='<div class="diag-head">Problems <span id="pcount">0</span></div><div id="plist" class="diag-empty">No problems</div>';
  host.appendChild(diag);

  // FAB
  var fab=U.el('button','fab',ICONS.plus);fab.onclick=function(){fileMenu(project,files);};
  host.appendChild(fab);

  function renderExplorer(){
    explorer.innerHTML='';
    var roots=groupFiles(files);
    renderNodes(roots,0,explorer);
  }
  function renderNodes(nodes,depth,parent){
    nodes.forEach(function(n){
      if(n.children){
        var row=U.el('div','fnode dir depth-'+Math.min(depth,3),ICONS.folder+'<span class="name">'+U.esc(n.name)+'</span>');
        row.onclick=function(){n.open=!n.open;renderExplorer();};
        parent.appendChild(row);
        if(n.open!==false)renderNodes(n.children,depth+1,parent);
      }else{
        var f=n.file;
        var row=U.el('div','fnode file depth-'+Math.min(depth,3)+(f.id===PM.activeFileId?' active':''),U.iconForFile(f.name)+'<span class="name">'+U.esc(f.name)+'</span>');
        row.onclick=function(){selectFile(f.id);};
        row.oncontextmenu=function(e){e.preventDefault();fileContext(f);};
        parent.appendChild(row);
      }
    });
  }
  function groupFiles(list){
    // simple: root files + folder groups by f.folder
    var roots=[];
    var folders={};
    list.forEach(function(f){
      var folder=f.folder||'';
      if(!folder){roots.push({file:f});}
      else{
        var parts=folder.split('/').filter(Boolean);
        var top=parts[0];
        if(!folders[top])folders[top]={name:top,children:[],open:true};
        folders[top].children.push({file:f});
      }
    });
    return roots.concat(Object.keys(folders).map(function(k){return folders[k];}));
  }

  function selectFile(id){
    // save current
    saveActive(true);
    if(PM.openTabs.indexOf(id)<0)PM.openTabs.push(id);
    PM.setActiveFileId(id);
    EditorView.render(editorHost,activeFile(),{});
    EditorView.refreshTabs(PM.openTabs.map(function(tid){return files.filter(function(x){return x.id===tid;})[0];}),PM.activeFileId,selectFile,closeTab);
    updateTitle();
    EditorView.state.onInput=function(){
      PM.markDirty(PM.activeFileId);
      autoSave();
      EditorView.refreshTabs(PM.openTabs.map(function(tid){return files.filter(function(x){return x.id===tid;})[0];}),PM.activeFileId,selectFile,closeTab);
      runDiagnostics();
    };
    updateExplorerActive();
    runDiagnostics();
  }
  function updateExplorerActive(){
    U.$$('.fnode.file',explorer).forEach(function(n){n.classList.remove('active');});
    renderExplorer();
  }
  function closeTab(id){
    var f=files.filter(function(x){return x.id===id;})[0];
    if(PM.isDirty(id)&&f){
      UI.confirm('Unsaved changes','Save changes to "'+f.name+'"?',function(){saveFile(f);doClose(id);},'Save');
      return;
    }
    doClose(id);
  }
  function doClose(id){
    var i=PM.openTabs.indexOf(id);
    if(i>=0)PM.openTabs.splice(i,1);
    if(PM.activeFileId===id){
      if(PM.openTabs.length)PM.activeFileId=PM.openTabs[PM.openTabs.length-1];
      else PM.activeFileId=null;
    }
    if(PM.activeFileId){
      EditorView.render(editorHost,activeFile(),{});
      EditorView.refreshTabs(PM.openTabs.map(function(tid){return files.filter(function(x){return x.id===tid;})[0];}),PM.activeFileId,selectFile,closeTab);
    }else{
      editorHost.innerHTML='<div class="empty" style="flex:1;">'+ICONS.file+'<h3>No file open</h3><p>Select a file from the explorer or create one.</p></div>';
    }
    updateTitle();
  }

  function saveActive(silent){
    var f=activeFile();
    if(!f)return;
    f.content=EditorView.getCode();
    f.modifiedAt=Date.now();
    f.type=U.fileType(f.name);
    PM.clearDirty(f.id);
    Storage.putFile(f).then(function(){
      project.modifiedAt=Date.now();
      Storage.putProject(project);
      if(!silent)UI.toast('Saved','success');
    });
  }
  function saveFile(f){
    var content=f.id===PM.activeFileId?EditorView.getCode():f.content;
    f.content=content;f.modifiedAt=Date.now();
    PM.clearDirty(f.id);
    Storage.putFile(f);
  }
  var autoSave=U.debounce(function(){
    if(Settings.get().autoSave)saveActive(true);
  },1200);

  function runDiagnostics(){
    var f=activeFile();
    if(!f)return;
    var issues=Diagnostics.analyze(f);
    var list=U.$('#plist',diag),count=U.$('#pcount',diag);
    if(!issues.length){list.className='diag-empty';list.textContent='No problems';count.textContent='0';return;}
    list.className='';
    list.innerHTML='';
    issues.forEach(function(i){
      var el=U.el('div','diag-item '+i.sev,'<span class="loc">'+i.file+':'+i.line+'</span><span>'+U.esc(i.msg)+'</span>');
      list.appendChild(el);
    });
    count.textContent=issues.length;
  }

  // init
  if(PM.activeFileId){
    EditorView.render(editorHost,activeFile(),{});
    EditorView.refreshTabs(PM.openTabs.map(function(tid){return files.filter(function(x){return x.id===tid;})[0];}),PM.activeFileId,selectFile,closeTab);
    EditorView.state.onInput=function(){
      PM.markDirty(PM.activeFileId);
      autoSave();
      EditorView.refreshTabs(PM.openTabs.map(function(tid){return files.filter(function(x){return x.id===tid;})[0];}),PM.activeFileId,selectFile,closeTab);
      runDiagnostics();
    };
  }else{
    editorHost.innerHTML='<div class="empty" style="flex:1;">'+ICONS.file+'<h3>No file open</h3><p>Select a file from the explorer or create one.</p></div>';
  }
  updateTitle();
  renderExplorer();
  runDiagnostics();
});

function newFileDialog(project,files){

function importFile(project){
  var inp=document.createElement('input');
  inp.type='file';
  inp.onchange=function(){
    var file=inp.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(){
      var f=PM.fileObject(project.id,file.name,'',String(reader.result||''));
      Storage.putFile(f).then(function(){UI.toast('Imported','success');Router.show('editor',{projectId:project.id});});
    };
    reader.readAsText(file);
  };
  inp.click();
}

function renameFile(f){
  UI.modal({
    title:'Rename File',
    body:'<div class="field"><label>New name</label><input class="input" id="rn" value="'+U.esc(f.name)+'"></div>',
    actions:[
      {label:'Cancel',cls:'btn-ghost',onClick:function(){UI.closeModal();}},

        var v=m.querySelector('#rn').value.trim();

function duplicateFile(f){
  var copy=Object.assign({},f,{id:U.uid(),name:f.name.replace(/(\.[^.]+)$/,' Copy$1'),createdAt:Date.now(),modifiedAt:Date.now()});
  Storage.putFile(copy).then(function(){UI.toast('Duplicated','success');Router.show('editor',{projectId:f.projectId});});

function deleteFile(f){
  Storage.delFile(f.id).then(function(){UI.toast('Deleted','success');Router.show('editor',{projectId:f.projectId});});

function exportFile(f){

  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click();
  UI.toast('Exported','success');

function renderSearch(host,p,files){
  var header=U.el('div','header');
  var back=U.el('button','btn-icon',ICONS.back);back.onclick=function(){Router.back();};
  header.appendChild(back);
  header.appendChild(U.el('div','title','Search Project'));
  host.appendChild(header);

  var content=U.el('div','content');
  content.innerHTML=
    '<div class="field"><label>Find</label><input class="input" id="q" placeholder="Search across all files"></div>'+
    '<div class="field"><label>Replace with</label><input class="input" id="r" placeholder="Optional"></div>'+
    '<div class="row" style="gap:8px;margin-bottom:14px;">'+
      '<button class="btn btn-secondary grow" id="findBtn">'+ICONS.search+' Find</button>'+
      '<button class="btn btn-secondary grow" id="replBtn">'+ICONS.edit+' Replace All</button>'+
    '</div>'+
    '<div id="results"></div>';
  host.appendChild(content);

  var results=content.querySelector('#results');

  function doFind(){
    var q=content.querySelector('#q').value;
    if(!q){results.innerHTML='';return;}
    var hits=[];
    files.forEach(function(f){
      var lines=(f.content||'').split('\n');
      lines.forEach(function(line,i){
        if(line.indexOf(q)>=0)hits.push({file:f,line:i+1,text:line});
      });
    });
    if(!hits.length){results.innerHTML='<div class="empty">'+ICONS.search+'<h3>No matches</h3></div>';return;}
    results.innerHTML='<h3 style="margin-bottom:10px;">'+hits.length+' matches</h3>';
    hits.slice(0,200).forEach(function(h){
      var row=U.el('div','card');
      row.style.cursor='pointer';
      row.innerHTML='<div class="row between"><div style="font-weight:600;">'+U.esc(h.file.name)+'</div><div class="muted">Line '+h.line+'</div></div>'+
        '<div class="muted" style="margin-top:6px;font-family:var(--font-mono);font-size:12px;white-space:pre-wrap;">'+U.esc(h.text)+'</div>';
      row.onclick=function(){
        PM.openTabs.length=0;PM.openTabs.push(h.file.id);PM.setActiveFileId(h.file.id);
        Router.push('editor',{projectId:p.id});
      };
      results.appendChild(row);
    });
  }

  function doReplace(){
    var q=content.querySelector('#q').value;
    var r=content.querySelector('#r').value;
    if(!q){UI.toast('Enter search text','error');return;}
    var total=0;
    var updates=[];
    files.forEach(function(f){
      if((f.content||'').indexOf(q)>=0){
        var count=f.content.split(q).length-1;
        total+=count;
        f.content=f.content.split(q).join(r);
        f.modifiedAt=Date.now();
        updates.push(Storage.putFile(f));
      }
    });
    if(!total){UI.toast('No matches','error');return;}
    Promise.all(updates).then(function(){
      UI.toast(total+' replacements','success');
      doFind();
    });
  }

  content.querySelector('#findBtn').onclick=doFind;
  content.querySelector('#replBtn').onclick=doReplace;
}

      '<h3 style="padding:20px 4px 8px;">Editor</h3>'+
      '<div class="settings-row"><div class="settings-label">Font size<small>'+s.fontSize+'px</small></div><input type="range" min="11" max="22" value="'+s.fontSize+'" id="fs"></div>'+
      '<div class="settings-row"><div class="settings-label">Tab size</div><input type="number" min="1" max="8" value="'+s.tabSize+'" id="ts" class="input" style="width:70px;min-height:40px;"></div>'+
      row('Word wrap','wrap',s.wordWrap)+
      row('Line numbers','ln',s.lineNumbers)+
      row('Syntax highlighting','sh',s.syntaxHighlight)+
      row('Auto save','as',s.autoSave)+
      row('Auto close brackets','acb',s.autoCloseBrackets)+
      row('Auto indent','ai',s.autoIndent)+
      '<button class="btn btn-ghost btn-block" id="reset" style="margin-top:20px;">Reset to defaults</button>'+
      '<div style="text-align:center;padding:30px 0;"><div class="badge">ZISHU TRON</div><p class="muted" style="margin-top:10px;">Zishu App Creator v1.0</p></div>';

    content.querySelector('#theme').onchange=function(e){Settings.set('theme',e.target.value);render();};
    content.querySelector('#fs').oninput=function(e){Settings.set('fontSize',parseInt(e.target.value,10));e.target.nextElementSibling;var l=e.target.previousElementSibling.querySelector('small');if(l)l.textContent=e.target.value+'px';};
    content.querySelector('#ts').onchange=function(e){Settings.set('tabSize',parseInt(e.target.value,10)||2);};
    content.querySelector('#wrap').onclick=function(){Settings.set('wordWrap',!Settings.get().wordWrap);render();};
    content.querySelector('#ln').onclick=function(){Settings.set('lineNumbers',!Settings.get().lineNumbers);render();};
    content.querySelector('#sh').onclick=function(){Settings.set('syntaxHighlight',!Settings.get().syntaxHighlight);EditorView.sync();render();};
    content.querySelector('#as').onclick=function(){Settings.set('autoSave',!Settings.get().autoSave);render();};
    content.querySelector('#acb').onclick=function(){Settings.set('autoCloseBrackets',!Settings.get().autoCloseBrackets);render();};
    content.querySelector('#ai').onclick=function(){Settings.set('autoIndent',!Settings.get().autoIndent);render();};
    content.querySelector('#reset').onclick=function(){Settings.reset();render();UI.toast('Settings reset');};
  }
  function row(label,id,on){
    return '<div class="settings-row"><div class="settings-label">'+label+'</div><div class="switch'+(on?' on':'')+'" id="'+id+'"></div></div>';
  }
  render();
});

/* -------- PROJECT SETTINGS -------- */
Router.register('project-settings',function(host,params){
  Storage.getProject(params.projectId).then(function(p){
    var header=U.el('div','header');
    var back=U.el('button','btn-icon',ICONS.back);back.onclick=function(){Router.back();};
    header.appendChild(back);header.appendChild(U.el('div','title','Project Settings'));
    host.appendChild(header);

    var c=U.el('div','content');
    c.innerHTML=
      '<div class="field"><label>App Name</label><input class="input" id="n" value="'+U.esc(p.name)+'"></div>'+
      '<div class="field"><label>Package Name</label><input class="input" id="pkg" value="'+U.esc(p.packageName)+'"></div>'+
      '<div class="field"><label>Version Name</label><input class="input" id="vn" value="'+U.esc(p.versionName)+'"></div>'+
      '<div class="field"><label>Version Code</label><input class="input" id="vc" type="number" value="'+p.versionCode+'"></div>'+
      '<div class="field"><label>Description</label><textarea class="textarea" id="d">'+U.esc(p.description||'')+'</textarea></div>'+
      '<div class="field"><label>Orientation</label><select class="select" id="o">'+
        '<option value="portrait"'+(p.settings.orientation==='portrait'?' selected':'')+'>Portrait</option>'+
        '<option value="landscape"'+(p.settings.orientation==='landscape'?' selected':'')+'>Landscape</option>'+
        '<option value="auto"'+(p.settings.orientation==='auto'?' selected':'')+'>Auto</option>'+
      '</select></div>'+
      '<button class="btn btn-primary btn-block" id="save">Save Settings</button>';
    host.appendChild(c);
    c.querySelector('#save').onclick=function(){
      p.name=c.querySelector('#n').value.trim();
      p.packageName=c.querySelector('#pkg').value.trim();
      p.versionName=c.querySelector('#vn').value.trim();
      p.versionCode=parseInt(c.querySelector('#vc').value,10)||1;
      p.description=c.querySelector('#d').value.trim();
      p.settings.orientation=c.querySelector('#o').value;
      p.modifiedAt=Date.now();
      Storage.putProject(p).then(function(){UI.toast('Settings saved','success');Router.back();});
    };
  });
});

/* -------- BUILD -------- */
Router.register('build',function(host,params){
  Storage.getProject(params.projectId).then(function(p){
    Storage.getFiles(params.projectId).then(function(files){
      PM.set({project:p,files:files});
      renderBuild(host,p,files);
    });
  });
});

function renderBuild(host,p,files){
  var header=U.el('div','header');
  var back=U.el('button','btn-icon',ICONS.back);back.onclick=function(){Router.back();};
  header.appendChild(back);header.appendChild(U.el('div','title','Build APK<small>'+U.esc(p.name)+'</small>'));
  host.appendChild(header);

  var c=U.el('div','content');
  c.innerHTML=
    '<div class="card">'+
      '<div class="row between"><div class="muted">Package</div><div style="font-weight:700;font-size:13px;">'+U.esc(p.packageName)+'</div></div>'+
      '<div class="row between" style="margin-top:8px;"><div class="muted">Version</div><div style="font-weight:700;">'+U.esc(p.versionName)+' ('+p.versionCode+')</div></div>'+
      '<div class="row between" style="margin-top:8px;"><div class="muted">Build Type</div><div style="font-weight:700;" id="btVal">Debug</div></div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="settings-label" style="margin-bottom:8px;">Build Type</div>'+
      '<div class="segment" id="bt">'+
        '<button data-v="debug" class="active">Debug</button>'+
        '<button data-v="release">Release</button>'+
      '</div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="settings-label" style="margin-bottom:8px;">Architecture</div>'+
      '<div class="segment" id="arch">'+
        '<button data-v="universal" class="active">Universal</button>'+
        '<button data-v="arm64">ARM64</button>'+
        '<button data-v="armv7">ARMv7</button>'+
      '</div>'+
    '</div>'+
    '<button class="btn btn-primary btn-block" id="buildBtn" style="margin-top:16px;">'+ICONS.build+' Build APK</button>'+
    '<div id="progressWrap" style="margin-top:16px;display:none;"><div class="progress"><i id="pbar"></i></div><p class="muted" id="pmsg" style="margin-top:8px;">Preparing...</p></div>'+
    '<div class="term" id="log" style="margin-top:16px;"><span class="t-line t-info">Ready to build.</span></div>'+
    '<div id="result"></div>'+
    '<p class="muted" style="margin-top:16px;text-align:center;">In browser mode, APK compilation requires the Android native build bridge. The build request is fully prepared and will be sent to <code>ZishuNative.buildProject()</code>.</p>';
  host.appendChild(c);

  var buildType='debug',architecture='universal';
  U.$$('#bt button',c).forEach(function(b){b.onclick=function(){
    U.$$('#bt button',c).forEach(function(x){x.classList.remove('active');});b.classList.add('active');
    buildType=b.dataset.v;
    c.querySelector('#btVal').textContent=buildType.charAt(0).toUpperCase()+buildType.slice(1);
  };});
  U.$$('#arch button',c).forEach(function(b){b.onclick=function(){
    U.$$('#arch button',c).forEach(function(x){x.classList.remove('active');});b.classList.add('active');
    architecture=b.dataset.v;
  };});

  var log=c.querySelector('#log'),pbar=c.querySelector('#pbar'),pmsg=c.querySelector('#pmsg'),pw=c.querySelector('#progressWrap'),result=c.querySelector('#result');

  function logLine(msg,type){
    var line=U.el('span','t-line t-'+(type||'info'),U.esc(msg));
    log.appendChild(line);log.appendChild(document.createElement('br'));
    log.scrollTop=log.scrollHeight;
  }

  window.addEventListener('zishu:build-progress',function(e){
    var d=e.detail||{};
    if(d.status==='native-required'){
      pw.style.display='block';pbar.style.width='100%';
      pmsg.textContent='Native bridge required';
      logLine('[native-required] '+d.message,'warn');
      result.innerHTML='<div class="card" style="margin-top:16px;border-color:var(--warning);">'+
        '<div class="row"><div style="flex-shrink:0;">'+ICONS.warn+'</div><div class="grow"><h3>Native bridge required</h3>'+
        '<p class="mid" style="margin-top:4px;">APK compilation requires the Android native build bridge. Attach it via <code>ZishuNative.buildProject()</code> to receive real build results.</p></div></div>'+
      '</div>';
      return;
    }
    if(d.status&&d.message)logLine(d.status+': '+d.message,d.status==='failed'?'err':d.status==='warning'?'warn':'info');
    if(d.progress!=null){pw.style.display='block';pbar.style.width=d.progress+'%';}
    if(d.status==='completed'&&d.apkPath){
      result.innerHTML='<div class="card" style="margin-top:16px;">'+
        '<h3>APK Ready</h3>'+
        '<p class="mid" style="margin-top:6px;">'+U.esc(d.fileName||'app.apk')+' — '+(d.size||0)+' bytes</p>'+
        '<div class="row" style="margin-top:12px;gap:8px;">'+
          '<button class="btn btn-secondary grow" id="dl">'+ICONS.download+' Download</button>'+
          '<button class="btn btn-secondary grow" id="sh">'+ICONS.share+' Share</button>'+
          '<button class="btn btn-primary grow" id="inst">'+ICONS.check+' Install</button>'+
        '</div></div>';
      result.querySelector('#dl').onclick=function(){ZishuNative.downloadApk(d.apkPath);};
      result.querySelector('#sh').onclick=function(){ZishuNative.shareApk(d.apkPath);};
      result.querySelector('#inst').onclick=function(){ZishuNative.installApk(d.apkPath);};
    }
  });

  c.querySelector('#buildBtn').onclick=function(){
    log.innerHTML='';
    result.innerHTML='';
    pw.style.display='block';pbar.style.width='5%';pmsg.textContent='Preparing build...';
    logLine('Preparing project...');
    p.build.buildType=buildType;
    p.build.architecture=architecture;
    Storage.putProject(p);
    setTimeout(function(){pbar.style.width='20%';logLine('Collecting files...');},300);
    setTimeout(function(){pbar.style.width='40%';logLine('Sending build request...');},700);
    Build.start();
  };
}

/* -------- COMMAND PALETTE -------- */
function commandPalette(){
  UI.modal({
    title:'Command Palette',
    body:'<div class="field"><input class="input" id="cmd" placeholder="Type a command..." autofocus></div>'+
      '<div id="cmdList"></div>',
    actions:[]
  });
  var m=document.querySelector('.modal');
  var inp=m.querySelector('#cmd'),list=m.querySelector('#cmdList');
  var cmds=[
    {label:'New Project',run:function(){Router.push('new-project');}},
    {label:'Open Home',run:function(){Router.reset('home');}},
    {label:'Settings',run:function(){Router.push('settings');}},
    {label:'Preview',run:function(){var p=PM.get();if(p)Router.push('preview',{projectId:p.project.id});}},
    {label:'Build APK',run:function(){var p=PM.get();if(p)Router.push('build',{projectId:p.project.id});}},
    {label:'Search Project',run:function(){var p=PM.get();if(p)Router.push('search',{projectId:p.project.id});}},
    {label:'Toggle Theme',run:function(){var s=Settings.get();Settings.set('theme',s.theme==='dark'?'light':'dark');UI.toast('Theme: '+Settings.get().theme);}}
  ];
  function render(filter){
    list.innerHTML='';
    cmds.filter(function(c){return c.label.toLowerCase().indexOf((filter||'').toLowerCase())>=0;}).forEach(function(c){
      var row=U.el('div','sheet-item',ICONS.play+'<span>'+c.label+'</span>');
      row.onclick=function(){UI.closeModal();setTimeout(c.run,50);};
      list.appendChild(row);
    });
  }
  render('');
  inp.oninput=function(){render(inp.value);};
}

/* =========================================================
   APP INIT + BACK BUTTON
   ========================================================= */
window.ZishuApp = {
  handleBack:function(){
    if(document.getElementById('modal-root').classList.contains('active')){UI.closeModal();return true;}
    if(document.getElementById('sheet-root').classList.contains('active')){UI.closeSheet();return true;}
    if(Router.canBack()){Router.back();return true;}
    // At home — let native handle exit
    return false;
  }
};

(function init(){
  // splash logo
  document.getElementById('splashLogo').innerHTML=ICONS.code;

  Storage.init().then(function(){
    Settings.load();
    return Storage.getMeta('recentProject');
  }).then(function(){
    setTimeout(function(){
      document.getElementById('screen-splash').classList.remove('active');
      Router.reset('home');
    },900);
  }).catch(function(e){
    console.error(e);
    setTimeout(function(){
      document.getElementById('screen-splash').classList.remove('active');
      Router.reset('home');
    },900);
  });

  // Register service worker (skip in file:// context)
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  // Native bridge event forwarding
  window.addEventListener('zishu:native-result',function(e){
    UI.toast('Native: '+JSON.stringify(e.detail));
  });

  // Android back button via history state
  window.addEventListener('popstate',function(){
    if(window.ZishuApp.handleBack()){
      history.pushState(null,'',location.href);
    }else{
      ZishuNative.closeApp();
    }
  });
  history.pushState(null,'',location.href);

  // Keyboard shortcut for command palette (Ctrl/Cmd+K)
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();commandPalette();}
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();var f=PM.get()&&PM.get().files.filter(function(x){return x.id===PM.activeFileId;})[0];if(f){f.content=EditorView.getCode();f.modifiedAt=Date.now();Storage.putFile(f);UI.toast('Saved','success');}}
  });

  // Auto-update status bar via native bridge when theme changes
  var origApply=Settings.applyTheme;
  Settings.applyTheme=function(t){
    origApply(t);
    var dark=document.documentElement.getAttribute('data-theme')==='dark';
    ZishuNative.setStatusBar({light:!dark});
    ZishuNative.setNavigationBar({light:!dark});
  };
})();
</script>
