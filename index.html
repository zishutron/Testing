<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Zishu Browser</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --font-system: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --transition-fast: 150ms ease;
    --transition-normal: 250ms ease;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.15);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.18);
  }

  [data-theme="light"] {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f5f7;
    --bg-tertiary: #ebebed;
    --bg-elevated: #ffffff;
    --bg-overlay: rgba(0,0,0,0.4);
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #86868b;
    --border-color: #d2d2d7;
    --border-subtle: #e5e5ea;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --accent-subtle: rgba(0,113,227,0.1);
    --success: #34c759;
    --warning: #ff9f0a;
    --error: #ff3b30;
    --scrollbar-thumb: #c1c1c6;
  }

  [data-theme="dark"] {
    --bg-primary: #1c1c1e;
    --bg-secondary: #2c2c2e;
    --bg-tertiary: #3a3a3c;
    --bg-elevated: #2c2c2e;
    --bg-overlay: rgba(0,0,0,0.6);
    --text-primary: #f5f5f7;
    --text-secondary: #a1a1a6;
    --text-tertiary: #8e8e93;
    --border-color: #38383a;
    --border-subtle: #2c2c2e;
    --accent: #0a84ff;
    --accent-hover: #409cff;
    --accent-subtle: rgba(10,132,255,0.15);
    --success: #30d158;
    --warning: #ffd60a;
    --error: #ff453a;
    --scrollbar-thumb: #48484a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--font-system);
    background: var(--bg-primary);
    color: var(--text-primary);
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    transition: background 200ms ease, color 200ms ease;
  }

  input, textarea { user-select: text; -webkit-user-select: text; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 2px; }

  /* ===== FIX 2 & 5: pageContent fits between top and bottom bars ===== */
  #pageContent {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg-primary);
    z-index: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .page-topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 56px;
    padding: 0 8px;
    padding-top: var(--safe-top);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
  }
  .page-topbar .back-btn {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border: none;
    background: transparent; color: var(--text-primary);
    border-radius: var(--radius-sm); cursor: pointer; flex-shrink: 0;
  }
  .page-topbar .back-btn:active { background: var(--bg-tertiary); }
  .page-topbar .back-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .page-topbar .page-title {
    font-size: 18px; font-weight: 600;
    color: var(--text-primary); flex: 1;
  }

  #pageInner {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: var(--safe-bottom);
  }

  /* ===== NEW TAB ===== */
  .new-tab-page {
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px; min-height: 100%;
    background: var(--bg-primary);
  }
  .new-tab-logo {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 24px; margin-top: 40px;
  }
  .new-tab-logo svg { width: 42px; height: 42px; fill: var(--accent); }
  .new-tab-logo span { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .new-tab-search {
    width: 100%; max-width: 480px;
    display: flex; align-items: center;
    background: var(--bg-secondary);
    border-radius: 24px;
    padding: 14px 20px; gap: 10px;
    margin-bottom: 32px;
    border: 1px solid var(--border-subtle);
  }
  .new-tab-search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-subtle);
  }
  .new-tab-search svg { width: 20px; height: 20px; fill: var(--text-tertiary); flex-shrink: 0; }
  .new-tab-search input {
    flex: 1; border: none; background: transparent;
    font-size: 15px; color: var(--text-primary);
    outline: none; font-family: var(--font-system);
  }

  .quick-links { width: 100%; max-width: 480px; margin-bottom: 28px; }
  .quick-links-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .quick-links-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .quick-links-add {
    width: 28px; height: 28px; border: none;
    background: var(--bg-tertiary); color: var(--text-secondary);
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .quick-links-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .quick-link {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 12px 4px;
    border-radius: var(--radius-md); cursor: pointer;
    position: relative;
  }
  .quick-link:active { background: var(--bg-secondary); }
  .quick-link-icon {
    width: 48px; height: 48px;
    border-radius: var(--radius-md);
    background: var(--bg-tertiary);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-size: 20px;
    font-weight: 600; color: var(--text-secondary);
  }
  .quick-link-label {
    font-size: 11px; color: var(--text-secondary);
    text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }
  .quick-link-remove {
    position: absolute; top: 2px; right: 2px;
    width: 18px; height: 18px;
    background: var(--error); color: #fff;
    border: none; border-radius: 50%;
    font-size: 10px; cursor: pointer;
    display: none; align-items: center; justify-content: center;
  }
  .quick-link:active .quick-link-remove { display: flex; }

  .recent-section { width: 100%; max-width: 480px; }
  .recent-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .recent-list { display: flex; flex-direction: column; gap: 4px; }

  /* ===== PAGE WRAPPER ===== */
  .page-wrapper {
    padding: 16px;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .page-section-title {
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 8px; padding: 0 4px; margin-top: 24px;
  }
  .page-section-title:first-child { margin-top: 0; }

  /* ===== LIST ROWS ===== */
  .list-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border-subtle);
    cursor: pointer;
    border-radius: var(--radius-sm);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row:active { background: var(--bg-tertiary); }
  .list-row-icon {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    background: var(--bg-tertiary);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; overflow: hidden;
  }
  .list-row-icon svg { width: 18px; height: 18px; fill: var(--text-secondary); }
  .list-row-content { flex: 1; min-width: 0; }
  .list-row-title {
    font-size: 14px; font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .list-row-subtitle {
    font-size: 12px; color: var(--text-tertiary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 2px;
  }
  .list-row-action {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border: none;
    background: transparent; color: var(--text-tertiary);
    border-radius: 50%; cursor: pointer; flex-shrink: 0;
    font-size: 14px;
  }
  .list-row-action:active { background: var(--bg-tertiary); }

  /* ===== EMPTY STATE ===== */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 64px 24px; text-align: center; gap: 12px;
  }
  .empty-state svg { width: 56px; height: 56px; fill: var(--text-tertiary); opacity: 0.5; }
  .empty-state-title { font-size: 16px; font-weight: 500; color: var(--text-secondary); }
  .empty-state-desc { font-size: 13px; color: var(--text-tertiary); max-width: 260px; }

  /* ===== DOWNLOAD ITEMS ===== */
  .dl-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .dl-item:last-child { border-bottom: none; }

  .dl-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    background: var(--bg-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .dl-icon svg { width: 20px; height: 20px; fill: var(--accent); }

  .dl-body {
    flex: 1;
    min-width: 0;
  }

  .dl-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }

  .dl-meta {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dl-progress {
    height: 4px;
    background: var(--bg-tertiary);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .dl-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 300ms ease;
  }

  .dl-progress-fill.indeterminate {
    animation: dl-indeterminate 1.5s ease-in-out infinite;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  @keyframes dl-indeterminate {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(300%); }
  }

  .dl-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .dl-action-btn {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: var(--text-tertiary);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    padding: 0;
  }
  .dl-action-btn:active { background: var(--bg-tertiary); color: var(--text-primary); }

  /* ===== SETTINGS ===== */
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border-subtle);
    gap: 12px;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row-label { font-size: 14px; color: var(--text-primary); flex: 1; }
  .settings-row-desc { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
  .settings-row-value { font-size: 13px; color: var(--text-tertiary); }

  .segmented {
    display: flex; background: var(--bg-tertiary);
    border-radius: var(--radius-sm); padding: 2px; gap: 2px;
  }
  .segmented button {
    padding: 6px 12px; border: none; background: transparent;
    color: var(--text-secondary); font-size: 12px; font-weight: 500;
    border-radius: 6px; cursor: pointer;
    font-family: var(--font-system);
    white-space: nowrap;
  }
  .segmented button.active {
    background: var(--bg-elevated);
    color: var(--text-primary);
    box-shadow: var(--shadow-sm);
  }

  .toggle { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-track {
    position: absolute; inset: 0;
    background: var(--border-color);
    border-radius: 13px;
    cursor: pointer;
    transition: background 150ms ease;
  }
  .toggle input:checked + .toggle-track { background: var(--accent); }
  .toggle-track::after {
    content: ''; position: absolute;
    top: 2px; left: 2px;
    width: 22px; height: 22px;
    background: #fff; border-radius: 50%;
    transition: transform 150ms ease;
    box-shadow: var(--shadow-sm);
  }
  .toggle input:checked + .toggle-track::after { transform: translateX(18px); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; padding: 10px 20px; border: none;
    border-radius: var(--radius-sm); font-size: 14px;
    font-weight: 500; font-family: var(--font-system);
    cursor: pointer; min-height: 40px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
  .btn-danger { background: var(--error); color: #fff; }
  .btn:active { opacity: 0.85; }
  .btn-full { width: 100%; }

  .input-field {
    width: 100%; height: 44px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 0 14px;
    font-size: 14px;
    color: var(--text-primary);
    outline: none;
    font-family: var(--font-system);
    margin-bottom: 16px;
  }
  .input-field:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-subtle);
  }

  /* ===== LEGAL / INFO PAGE ===== */
  .legal-content {
    padding: 20px 4px;
    font-size: 14px;
    line-height: 1.65;
    color: var(--text-primary);
    user-select: text;
    -webkit-user-select: text;
  }
  .legal-content h2 {
    font-size: 18px;
    font-weight: 700;
    margin: 24px 0 10px 0;
    color: var(--text-primary);
  }
  .legal-content h2:first-child { margin-top: 0; }
  .legal-content h3 {
    font-size: 15px;
    font-weight: 600;
    margin: 18px 0 8px 0;
    color: var(--text-primary);
  }
  .legal-content p {
    margin-bottom: 12px;
    color: var(--text-secondary);
  }
  .legal-content ul {
    margin: 8px 0 12px 20px;
    color: var(--text-secondary);
  }
  .legal-content li {
    margin-bottom: 6px;
  }
  .legal-content strong { color: var(--text-primary); }

  .info-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 16px;
    margin: 16px 0;
  }
  .info-card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .email-display {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    word-break: break-all;
    user-select: text;
    -webkit-user-select: text;
    margin-bottom: 12px;
    padding: 12px;
    background: var(--bg-primary);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    font-family: 'Courier New', monospace;
  }

  /* ===== OVERLAY / DIALOG / TOAST ===== */
  .overlay {
    position: fixed; inset: 0;
    background: var(--bg-overlay); z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease;
  }
  .overlay.visible { opacity: 1; pointer-events: auto; }

  .dialog {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: var(--bg-elevated);
    border-radius: var(--radius-lg);
    padding: 24px; z-index: 500;
    width: calc(100% - 48px);
    max-width: 360px;
    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
    box-shadow: var(--shadow-lg);
  }
  .dialog.visible {
    opacity: 1; pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }
  .dialog-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  .dialog-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .toast {
    position: fixed;
    bottom: calc(32px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text-primary);
    color: var(--bg-primary);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    z-index: 600;
    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
    max-width: calc(100% - 48px);
    text-align: center;
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div id="pageContent">
  <div class="page-topbar" id="pageTopbar" style="display:none">
    <button class="back-btn" id="pageBackBtn">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="page-title" id="pageTitle">Page</div>
  </div>
  <div id="pageInner"></div>
</div>

<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>

<div class="dialog" id="dialog">
  <div class="dialog-title" id="dialogTitle"></div>
  <div class="dialog-desc" id="dialogDesc"></div>
  <div class="dialog-actions" id="dialogActions"></div>
</div>

<script>
(function() {
  'use strict';

  var ZISHU_CONFIG = {
    version: '1.0.0',
    frontendVersion: '1.0.0',
    nativeBridgeName: 'ZishuNative',
    supportEmail: 'support.stardustofficial@gmail.com',
    maxHistory: 5000,
    maxBookmarks: 2000
  };

  var SEARCH_ENGINES = {
    google: { id: 'google', name: 'Google', searchUrl: 'https://www.google.com/search?q=%s' },
    bing: { id: 'bing', name: 'Bing', searchUrl: 'https://www.bing.com/search?q=%s' },
    duckduckgo: { id: 'duckduckgo', name: 'DuckDuckGo', searchUrl: 'https://duckduckgo.com/?q=%s' },
    yahoo: { id: 'yahoo', name: 'Yahoo', searchUrl: 'https://search.yahoo.com/search?p=%s' }
  };

  var StorageManager = (function() {
    var PREFIX = 'zishu_';
    function safeGet(key, fallback) {
      try {
        var raw = localStorage.getItem(PREFIX + key);
        if (raw === null) return fallback;
        return JSON.parse(raw);
      } catch (e) { return fallback; }
    }
    function safeSet(key, value) {
      try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); return true; }
      catch (e) { return false; }
    }
    function safeRemove(key) { try { localStorage.removeItem(PREFIX + key); } catch (_) {} }
    return { get: safeGet, set: safeSet, remove: safeRemove };
  })();

  var NativeBridge = (function() {
    var available = false;
    function detect() {
      try {
        var b = window[ZISHU_CONFIG.nativeBridgeName];
        available = !!(b && typeof b === 'object');
      } catch (e) { available = false; }
      return available;
    }
    function call(method) {
      var args = Array.prototype.slice.call(arguments, 1);
      try {
        var b = window[ZISHU_CONFIG.nativeBridgeName];
        if (b && typeof b[method] === 'function') return b[method].apply(b, args);
      } catch (e) {}
      return null;
    }
    return {
      detect: detect,
      isAvailable: function() { return available; },
      navigateTo: function(u) { return call('navigateTo', String(u)); },
      openUrl: function(u) { return call('openUrl', String(u)); },
      goBack: function() { return call('goBack'); },
      goForward: function() { return call('goForward'); },
      reload: function() { return call('reload'); },
      newTab: function(u) { return call('newTab', String(u || '')); },
      newPrivateTab: function(u) { return call('newPrivateTab', String(u || '')); },
      closeTab: function(id) { return call('closeTab', String(id)); },
      switchTab: function(id) { return call('switchTab', String(id)); },
      openInternalPage: function(u) { return call('openInternalPage', String(u)); },
      closeOverlay: function() { return call('closeOverlay'); },
      download: function(u, f) { return call('download', String(u), String(f || '')); },
      cancelDownload: function(id) { return call('cancelDownload', String(id)); },
      installApk: function(id) { return call('installApk', String(id)); },
      openDownloadedFile: function(id) { return call('openDownloadedFile', String(id)); },
      share: function(data) { return call('share', JSON.stringify(data || {})); },
      copyText: function(t) { return call('copyText', String(t)); },
      showToast: function(m) { return call('showToast', String(m)); },
      openExternal: function(u) { return call('openExternal', String(u)); },

        h += '<button class="list-row-action" data-id="' + escapeHtml(b.id) + '">✕</button></div>';

      var removeBtns = listEl.querySelectorAll('.list-row-action');

  // ---------- DOWNLOADS ----------
  function renderDownloadsPage() {
    clearPage();
    setPageHeader('Downloads');

    var downloads = BrowserState.state.downloads;
    var html = '<div class="page-wrapper">';

    if (downloads.length === 0) {
      html += '<div class="empty-state">';
      html += '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>';
      html += '<div class="empty-state-title">No downloads yet</div>';
      html += '<div class="empty-state-desc">Files you download will appear here.</div>';
      html += '</div></div>';
      pageInner.innerHTML = html;
      return;
    }

    var hasCompleted = false;
    for (var c = 0; c < downloads.length; c++) {
      if (downloads[c].status === 'completed' ||
          downloads[c].status === 'cancelled' ||
          downloads[c].status === 'failed') {
        hasCompleted = true;
        break;
      }
    }
    if (hasCompleted) {
      html += '<div style="display:flex;justify-content:flex-end;margin-bottom:12px">';
      html += '<button class="btn btn-secondary" id="clearCompletedDl" style="font-size:12px;padding:6px 12px">Clear Completed</button>';
      html += '</div>';
    }

    html += '<div id="dlList"></div>';
    html += '</div>';
    pageInner.innerHTML = html;

    var listEl = document.getElementById('dlList');
    listEl.innerHTML = renderDownloadItems(downloads);
    bindDownloadActions(listEl);

    var ccBtn = document.getElementById('clearCompletedDl');
    if (ccBtn) {
      ccBtn.addEventListener('click', function() {
        DownloadManager.clearCompleted();
        renderDownloadsPage();
      });
    }
  }

  function renderDownloadItems(downloads) {
    var h = '';
    for (var i = 0; i < downloads.length; i++) {
      var dl = downloads[i];
      var statusText = '';
      var statusColor = 'var(--text-tertiary)';
      var showProgress = false;
      var extraActions = '';

      if (dl.status === 'downloading' || dl.status === 'waiting') {
        statusText = 'Downloading';
        statusColor = 'var(--accent)';
        showProgress = true;
        extraActions += '<button class="dl-action-btn" data-action="cancel" data-id="' + escapeHtml(dl.id) + '" title="Cancel">✕</button>';

      } else if (dl.status === 'paused') {
        statusText = 'Paused';
        statusColor = 'var(--warning)';
        showProgress = true;
        extraActions += '<button class="dl-action-btn" data-action="cancel" data-id="' + escapeHtml(dl.id) + '" title="Cancel">✕</button>';

      } else if (dl.status === 'completed') {
        statusText = 'Completed';
        statusColor = 'var(--success)';

        var isApk = dl.filename && dl.filename.toLowerCase().indexOf('.apk') > 0;
        if (isApk) {
          extraActions += '<button class="dl-action-btn" data-action="install" data-id="' + escapeHtml(dl.id) + '" title="Install" style="background:var(--accent);color:#fff">⤓</button>';
        } else {
          extraActions += '<button class="dl-action-btn" data-action="open" data-id="' + escapeHtml(dl.id) + '" title="Open">↗</button>';
        }
        extraActions += '<button class="dl-action-btn" data-action="remove" data-id="' + escapeHtml(dl.id) + '" title="Remove">✕</button>';

      } else if (dl.status === 'failed') {
        statusText = dl.error || 'Failed';
        statusColor = 'var(--error)';
        extraActions += '<button class="dl-action-btn" data-action="retry" data-id="' + escapeHtml(dl.id) + '" data-url="' + escapeHtml(dl.url) + '" data-filename="' + escapeHtml(dl.filename) + '" title="Retry">↻</button>';
        extraActions += '<button class="dl-action-btn" data-action="remove" data-id="' + escapeHtml(dl.id) + '" title="Remove">✕</button>';

      } else if (dl.status === 'cancelled') {
        statusText = 'Cancelled';
        statusColor = 'var(--text-tertiary)';
        extraActions += '<button class="dl-action-btn" data-action="remove" data-id="' + escapeHtml(dl.id) + '" title="Remove">✕</button>';
      }

      h += '<div class="dl-item">';
      h += '<div class="dl-icon"><svg viewBox="0 0 24 24"><path d="M6 2c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/></svg></div>';
      h += '<div class="dl-body">';
      h += '<div class="dl-name">' + escapeHtml(dl.filename) + '</div>';
      h += '<div class="dl-meta">';
      h += '<span style="color:' + statusColor + '">' + escapeHtml(statusText) + '</span>';

      if (dl.status === 'downloading' || dl.status === 'waiting') {
        if (dl.size > 0) {
          h += ' · <span>' + DownloadManager.formatSize(dl.downloaded) + ' / ' + DownloadManager.formatSize(dl.size) + '</span>';
          if (dl.speed > 0) {
            h += ' · <span>' + DownloadManager.formatSpeed(dl.speed) + '</span>';
            var remaining = (dl.size - dl.downloaded) / dl.speed;
            if (remaining > 0 && isFinite(remaining)) {
              h += ' · <span>' + DownloadManager.formatTime(remaining) + ' left</span>';
            }
          }
        } else {
          h += ' · <span>' + DownloadManager.formatSize(dl.downloaded) + '</span>';
          if (dl.speed > 0) {
            h += ' · <span>' + DownloadManager.formatSpeed(dl.speed) + '</span>';
          }
        }
      } else if (dl.status === 'completed' && dl.size > 0) {
        h += ' · <span>' + DownloadManager.formatSize(dl.size) + '</span>';
      }

      h += '</div>';

      if (showProgress) {
        var pct = dl.progress || 0;
        var sizeUnknown = dl.size <= 0;
        h += '<div class="dl-progress"><div class="dl-progress-fill' + (sizeUnknown ? ' indeterminate' : '') + '" style="width:' + (sizeUnknown ? '30' : pct) + '%"></div></div>';
      }

      h += '</div>';
      h += '<div class="dl-actions">' + extraActions + '</div>';
      h += '</div>';
    }
    return h;
  }

  function bindDownloadActions(container) {
    var btns = container.querySelectorAll('.dl-action-btn');
    for (var i = 0; i < btns.length; i++) {
      (function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var action = btn.getAttribute('data-action');
          var id = btn.getAttribute('data-id');

          if (action === 'cancel') {
            if (NativeBridge.isAvailable()) NativeBridge.cancelDownload(id);
            DownloadManager.update(id, { status: 'cancelled', endTime: Date.now() });
            UIManager.showToast('Download cancelled');
            renderDownloadsPage();

          } else if (action === 'remove') {
            DownloadManager.remove(id);
            renderDownloadsPage();

          } else if (action === 'open') {
            if (NativeBridge.isAvailable()) {
              NativeBridge.openDownloadedFile(id);
            } else {
              UIManager.showToast('Opening file…');
            }

          } else if (action === 'install') {
            if (NativeBridge.isAvailable()) {
              NativeBridge.installApk(id);
            } else {
              UIManager.showToast('Install requires native support');
            }

          } else if (action === 'retry') {
            var url = btn.getAttribute('data-url');
            var filename = btn.getAttribute('data-filename');
            if (url && NativeBridge.isAvailable()) {
              DownloadManager.remove(id);
              NativeBridge.download(url, filename);
              UIManager.showToast('Retrying download…');
            }
          }
        });
      })(btns[i]);
    }
  }

    var html = '<div class="page-wrapper">';
    html += '<div class="legal-content">';
    html += '<h2>We\'re here to help</h2>';
    html += '<p>If you have any questions, issues, or feedback about Zishu Browser, feel free to reach out to us. We usually respond within 24-48 hours.</p>';
    html += '</div>';
    html += '<div class="info-card">';
    html += '<div class="info-card-title">Support Email</div>';
    html += '<div class="email-display" id="supportEmailText">' + escapeHtml(ZISHU_CONFIG.supportEmail) + '</div>';
    html += '<button class="btn btn-primary btn-full" id="copyEmailBtn" style="margin-bottom:8px">Copy Email Address</button>';
    html += '<button class="btn btn-secondary btn-full" id="openMailAppBtn">Open in Mail App</button>';
    html += '</div>';
    html += '</div>';
    pageInner.innerHTML = html;

    document.getElementById('copyEmailBtn').addEventListener('click', function() {
      var email = ZISHU_CONFIG.supportEmail;
      if (NativeBridge.isAvailable()) {
        NativeBridge.copyText(email);
        UIManager.showToast('Email copied to clipboard');
        return;
      }
      try {
        var ta = document.createElement('textarea');
        ta.value = email;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        UIManager.showToast('Email copied to clipboard');
      } catch (e) {
        UIManager.showToast('Could not copy');
      }
    });

    document.getElementById('openMailAppBtn').addEventListener('click', function() {
      var email = ZISHU_CONFIG.supportEmail;
      var mailto = 'mailto:' + email + '?subject=' + encodeURIComponent('Zishu Browser Support');
      if (NativeBridge.isAvailable()) {
        NativeBridge.openExternal(mailto);
      } else {
        window.location.href = mailto;
      }
    });
  }

  // ---------- ABOUT ----------
  function renderAboutPage() {
    clearPage();
    setPageHeader('About');
    var html = '<div class="page-wrapper" style="text-align:center">';
    html += '<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin:32px 0 16px">';
    html += '<svg viewBox="0 0 24 24" style="width:56px;height:56px;fill:var(--accent)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>';
    html += '<span style="font-size:24px;font-weight:700">Zishu Browser</span></div>';
    html += '<div style="font-size:14px;color:var(--text-secondary);margin-bottom:4px">Version ' + ZISHU_CONFIG.version + '</div>';
    html += '<div style="font-size:12px;color:var(--text-tertiary);margin-bottom:32px">Frontend ' + ZISHU_CONFIG.frontendVersion + '</div>';
    html += '<div style="text-align:left">';
    html += '<div class="settings-row"><div class="settings-row-label">Native Bridge</div><div class="settings-row-value">' + (NativeBridge.isAvailable() ? 'Connected' : 'Not available') + '</div></div>';
    html += '<div class="settings-row"><div class="settings-row-label">Support</div><div class="settings-row-value">' + escapeHtml(ZISHU_CONFIG.supportEmail) + '</div></div>';
    html += '</div>';
    html += '<div style="margin-top:32px;font-size:12px;color:var(--text-tertiary)">© ' + new Date().getFullYear() + ' Zishu Browser</div>';
    html += '</div>';
    pageInner.innerHTML = html;
  }

  // ---------- MENU ----------
  function renderMenuPage() {
    clearPage();
    setPageHeader('Menu');
    var items = [
      { label: 'New Tab', action: function() { NativeBridge.newTab(''); renderNewTabPage(); } },
      { label: 'New Private Tab', action: function() { NativeBridge.newPrivateTab(''); } },
      { label: 'History', action: function() { renderHistoryPage(); } },
      { label: 'Bookmarks', action: function() { renderBookmarksPage(); } },
      { label: 'Downloads', action: function() { renderDownloadsPage(); } },
      { label: 'Settings', action: function() { renderSettingsPage(); } },
      { label: 'About', action: function() { renderAboutPage(); } }
    ];
    var html = '<div class="page-wrapper">';
    for (var i = 0; i < items.length; i++) {
      (function(item) {
        html += '<div class="list-row menu-item-row" data-idx="' + i + '">';
        html += '<div class="list-row-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg></div>';
        html += '<div class="list-row-content"><div class="list-row-title">' + escapeHtml(item.label) + '</div></div>';
        html += '</div>';
      })(items[i]);
    }
    html += '</div>';
    pageInner.innerHTML = html;

    var rows = pageInner.querySelectorAll('.menu-item-row');
    for (var j = 0; j < rows.length; j++) {
      (function(idx) {
        rows[j].addEventListener('click', function() { items[idx].action(); });
      })(j);
    }
  }

  // ---------- TABS ----------
  function renderTabsPage() {
    clearPage();
    setPageHeader('Tabs');
    var html = '<div class="page-wrapper">';
    html += '<button class="btn btn-primary btn-full" id="newTabFromOverview" style="margin-bottom:16px">+ New Tab</button>';
    html += '<div id="tabsList"></div></div>';
    pageInner.innerHTML = html;

    var listEl = document.getElementById('tabsList');
    function render() {
      var tabs = BrowserState.state.tabs;
      if (tabs.length === 0) {
        listEl.innerHTML = '<div class="empty-state"><div class="empty-state-title">No tabs</div></div>';
        return;
      }
      var h = '';
      for (var i = 0; i < tabs.length; i++) {
        var t = tabs[i];
        h += '<div class="list-row" data-id="' + escapeHtml(t.id) + '">';
        h += '<div class="list-row-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg></div>';
        h += '<div class="list-row-content">';
        h += '<div class="list-row-title">' + escapeHtml(t.title || 'New Tab') + '</div>';
        h += '<div class="list-row-subtitle">' + escapeHtml(SearchManager.getDisplayUrl(t.url) || 'New Tab') + '</div></div>';
        h += '<button class="list-row-action" data-close="' + escapeHtml(t.id) + '">✕</button></div>';
      }
      listEl.innerHTML = h;

      var rows = listEl.querySelectorAll('.list-row');
      for (var j = 0; j < rows.length; j++) {
        (function(row) {
          row.addEventListener('click', function(e) {
            if (e.target.classList.contains('list-row-action')) return;
            var id = row.getAttribute('data-id');
            BrowserState.setActiveTab(id);
            if (NativeBridge.isAvailable()) NativeBridge.switchTab(id);
            renderNewTabPage();
          });
        })(rows[j]);
      }
      var closeBtns = listEl.querySelectorAll('[data-close]');
      for (var k = 0; k < closeBtns.length; k++) {
        (function(btn) {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var id = btn.getAttribute('data-close');
            BrowserState.closeTab(id);
            if (NativeBridge.isAvailable()) NativeBridge.closeTab(id);
            render();
          });
        })(closeBtns[k]);
      }
    }
    render();

    var nt = document.getElementById('newTabFromOverview');
    if (nt) nt.addEventListener('click', function() {
      NativeBridge.newTab('');
      BrowserState.createTab();
      renderNewTabPage();
    });
  }

  var NavigationManager = (function() {
    function navigate(input) {
      if (!input) return;
      var url = String(input).trim();
      if (!url) return;

      if (url.indexOf('zishu://') === 0 || url.indexOf('about:') === 0) {
        handleInternalPage(url);
        return;
      }

      if (SearchManager.isUrl(url)) url = SearchManager.normalizeUrl(url);
      else url = SearchManager.getSearchUrl(url);

      if (NativeBridge.isAvailable()) {
        NativeBridge.hideKeyboard();
        NativeBridge.closeOverlay();
        NativeBridge.navigateTo(url);
      } else {
        UIManager.showToast('Native not available');
        return;
      }

      var tab = BrowserState.getActiveTab();
      if (tab) BrowserState.updateTab(tab.id, { url: url, loading: true });
      HistoryManager.add({ url: url, title: url, private: tab ? tab.private : false });
    }

    function handleInternalPage(url) {
      var page = url.replace('zishu://', '').replace('about:', '');
      if (page === 'menu') { renderMenuPage(); return; }
      if (page === 'tabs') { renderTabsPage(); return; }
      var routes = {
        newtab: renderNewTabPage,
        history: renderHistoryPage,
        bookmarks: renderBookmarksPage,
        downloads: renderDownloadsPage,
        settings: renderSettingsPage,
        about: renderAboutPage
      };
      var fn = routes[page];
      if (fn) fn();
      else renderNewTabPage();
    }

    return { navigate: navigate, handleInternalPage: handleInternalPage };
  })();

  window.ZishuBridgeEvents = {
    onNativeReady: function() { NativeBridge.detect(); },
    onPageStarted: function() {},
    onPageFinished: function(data) {
      try {
        var d = typeof data === 'string' ? JSON.parse(data) : data;
        if (d && d.url) {
          var tab = BrowserState.getActiveTab();
          if (tab) BrowserState.updateTab(tab.id, { url: d.url, title: d.title || tab.title, loading: false });
        }
      } catch (e) {}
    },
    onPageError: function() {},
    onNavigationChanged: function(data) {
      try {
        var d = typeof data === 'string' ? JSON.parse(data) : data;
        if (d && d.url) {
          var tab = BrowserState.getActiveTab();
          if (tab) BrowserState.updateTab(tab.id, { url: d.url, title: d.title || tab.title });
        }
      } catch (e) {}
    },
    onTabsChanged: function(data) {
      try {
        var tabs = typeof data === 'string' ? JSON.parse(data) : data;
        if (Array.isArray(tabs)) {
          var newTabs = [];
          var activeId = null;
          for (var i = 0; i < tabs.length; i++) {
            var t = tabs[i];
            newTabs.push({
              id: t.id || ('tab_' + i),
              url: t.url || '',
              title: t.title || 'New Tab',
              favicon: t.favicon || '',
              private: !!t.private,
              loading: !!t.loading
            });
            if (t.active) activeId = t.id;
          }
          BrowserState.state.tabs = newTabs;
          if (activeId) BrowserState.state.activeTabId = activeId;
          else if (newTabs.length > 0) BrowserState.state.activeTabId = newTabs[0].id;
        }
      } catch (e) {}
    },
    onDownloadStarted: function(d) {
      try {
        var data = typeof d === 'string' ? JSON.parse(d) : d;
        DownloadManager.add({
          id: data.id,
          url: data.url,
          filename: data.filename,
          size: data.size || 0
        });
        UIManager.showToast('Download started: ' + (data.filename || ''));
      } catch (e) {}
    },
    onDownloadProgress: function(d) {
      try {
        var data = typeof d === 'string' ? JSON.parse(d) : d;
        var status = 'downloading';
        if (data.status === 1) status = 'paused';
        else if (data.status === 2) status = 'completed';
        DownloadManager.update(data.id, {
          downloaded: data.downloaded || 0,
          size: data.size || 0,
          speed: data.speed || 0,
          status: status
        });
      } catch (e) {}
    },
    onDownloadFinished: function(d) {
      try {
        var data = typeof d === 'string' ? JSON.parse(d) : d;
        DownloadManager.update(data.id, {
          status: 'completed',
          downloaded: data.size || 0,
          size: data.size || 0,
          endTime: Date.now()
        });
        UIManager.showToast('Download complete');
      } catch (e) {}
    },
    onDownloadError: function(d) {
      try {
        var data = typeof d === 'string' ? JSON.parse(d) : d;
        DownloadManager.update(data.id, {
          status: 'failed',
          error: data.error || 'Download failed',
          endTime: Date.now()
        });
        UIManager.showToast(data.error || 'Download failed');
      } catch (e) {}
    },
    onThemeChanged: function(d) {
      try {
        var t = typeof d === 'string' ? JSON.parse(d) : d;
        if (t && t.theme) {
          SettingsManager.set('theme', t.theme);
          ThemeManager.apply(t.theme, true);
        }
      } catch (e) {}
    },
    onOpenInternalPage: function(url) {
      if (!url || typeof url !== 'string') return;
      NavigationManager.handleInternalPage(url);
    },
    onBackPressed: function() {
      if (NativeBridge.isAvailable()) NativeBridge.closeOverlay();
      renderNewTabPage();
      return true;
    }
  };

  function init() {
    SettingsManager.load();
    HistoryManager.load();
    BookmarkManager.load();
    DownloadManager.load();
    BrowserState.state.quickLinks = StorageManager.get('quickLinks', []);

    NativeBridge.detect();
    ThemeManager.init();

    var tab = BrowserState.createTab({ url: 'zishu://newtab', title: 'New Tab' });
    BrowserState.setActiveTab(tab.id);

    renderNewTabPage();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
